<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="100%" style="max-width:720px;font-family:system-ui,sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1a365d"/></marker></defs><rect width="720" height="280" fill="#f8fafc" rx="14"/><text x="360" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1a365d">L-1→EB-1C跨国公司高管移民</text><rect x="50" y="45" width="180" height="55" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="140" y="65" text-anchor="middle" font-size="10" font-weight="600">1.海外公司运营≥1年</text><text x="140" y="82" text-anchor="middle" font-size="9" fill="#6b7280">高管/经理职位≥3年</text><line x1="234" y1="72" x2="266" y2="72" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="270" y="45" width="180" height="55" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="360" y="65" text-anchor="middle" font-size="10" font-weight="600">2.设立美国子公司</text><text x="360" y="82" text-anchor="middle" font-size="9" fill="#6b7280">或收购美国公司</text><line x1="454" y1="72" x2="486" y2="72" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="490" y="45" width="180" height="55" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="580" y="65" text-anchor="middle" font-size="10" font-weight="600">3.提交I-129(L-1A)</text><text x="580" y="82" text-anchor="middle" font-size="9" fill="#6b7280">加急15天获批</text><line x1="580" y1="102" x2="580" y2="155" stroke="#1a365d" stroke-width="1.5"/><line x1="580" y1="155" x2="46" y2="155" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="50" y="130" width="180" height="50" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="140" y="150" text-anchor="middle" font-size="10" font-weight="600">4.持L-1A入境美国</text><text x="140" y="168" text-anchor="middle" font-size="9" fill="#6b7280">首签1-3年</text><line x1="234" y1="155" x2="266" y2="155" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="270" y="130" width="180" height="50" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="360" y="150" text-anchor="middle" font-size="10" font-weight="600">5.美国公司运营≥1年</text><text x="360" y="168" text-anchor="middle" font-size="9" fill="#6b7280">有员工、有营收</text><line x1="454" y1="155" x2="486" y2="155" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="490" y="130" width="180" height="50" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="580" y="150" text-anchor="middle" font-size="10" font-weight="600">6.提交I-140(EB-1C)</text><text x="580" y="168" text-anchor="middle" font-size="9" fill="#6b7280">加急15天</text><line x1="580" y1="182" x2="580" y2="235" stroke="#1a365d" stroke-width="1.5"/><rect x="490" y="210" width="180" height="50" rx="10" fill="#e0edf6" stroke="#1a365d" stroke-width="2"/><text x="580" y="230" text-anchor="middle" font-size="11" font-weight="700">🎯 获批永久绿卡</text><text x="580" y="248" text-anchor="middle" font-size="9" fill="#6b7280">一步到位绿卡</text></svg>
