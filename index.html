<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>美国移民项目资格评估</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif;background:#f5f6f8;color:#1a1a1a;line-height:1.6;-webkit-text-size-adjust:100%}
.container{max-width:720px;margin:0 auto;padding:0 0 40px}
.header{background:linear-gradient(135deg,#1a3350,#2969a8);color:#fff;padding:32px 20px 28px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{font-size:22px;margin-bottom:4px}
.header p{opacity:.85;font-size:13px}
.card{background:#fff;border-radius:14px;padding:24px 18px;margin:16px 12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h2{font-size:17px;color:#1a3350;margin-bottom:16px;padding-bottom:10px;border-bottom:1.5px solid #eef1f5;display:flex;align-items:center;gap:8px}
.card h2 .num{background:#1a3350;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.card h3.sub{font-size:14px;color:#666;margin:18px 0 10px;padding-left:8px;border-left:3px solid #2969a8}
.fg{margin-bottom:16px}
.fg label.q{display:block;font-weight:600;font-size:14px;margin-bottom:5px;color:#333}
.fg .hint{font-size:12px;color:#999;margin-bottom:4px;font-weight:400}
.fg select,.fg input[type=text]{width:100%;padding:11px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;transition:border .2s;background:#fafafa;-webkit-appearance:none}
.fg select:focus,.fg input:focus{outline:none;border-color:#2969a8;background:#fff}
.detail-input{margin-top:8px;display:none}
.detail-input.show{display:block}
.detail-input input{width:100%;padding:10px 12px;border:1.5px solid #b8d8f0;border-radius:8px;font-size:14px;background:#e8f4fd}
.detail-input input::placeholder{color:#999}
.detail-input .label-sm{font-size:12px;color:#666;margin-bottom:4px;display:block}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio-row .ropt{flex:1;min-width:80px;padding:10px 16px;border:1.5px solid #ddd;border-radius:8px;text-align:center;cursor:pointer;font-size:14px;background:#fafafa;transition:all .15s;user-select:none}
.radio-row .ropt:active,.radio-row .ropt.sel{border-color:#2969a8;background:#e8f4fd;font-weight:600;color:#1a3350}
.radio-row input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.btn{display:block;width:calc(100% - 24px);margin:20px auto;padding:14px;background:linear-gradient(135deg,#1a3350,#2969a8);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
.btn:active{transform:scale(.98)}

.results-wrap{display:none;margin:0 12px}
.results-wrap.show{display:block}
.rs-card{background:#fff;border-radius:14px;padding:20px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.rs-card h3{font-size:18px;margin-bottom:6px;color:#1a3350}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;margin:3px}
.tg{background:#dcfce7;color:#166534}
.ty{background:#fef3c7;color:#92400e}
.tr{background:#fee2e2;color:#991b1b}
.prog{background:#f8fafc;border-radius:10px;padding:16px;margin-bottom:10px}
.prog.el{border-left:4px solid #22c55e}
.prog.mb{border-left:4px solid #f59e0b}
.prog.no{border-left:4px solid #e0e0e0;opacity:.85}
.prog h4{font-size:15px;margin-bottom:6px;color:#1a3350}
.prog .st{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;margin-bottom:6px}
.st-q{background:#dcfce7;color:#166534}.st-m{background:#fef3c7;color:#92400e}.st-n{background:#fee2e2;color:#991b1b}
.prog .d{font-size:13px;color:#555;line-height:1.7}
.g{color:#166534;font-weight:600}.o{color:#c2410c;font-weight:600}
table.cm{width:100%;border-collapse:collapse;margin:12px 0;font-size:12px}
table.cm th,table.cm td{border:1px solid #e2e8f0;padding:7px;text-align:center}
table.cm th{background:#f1f5f9;font-weight:600;font-size:11px}
table.cm td:first-child{text-align:left;font-weight:500}
.hb{background:#e8f4fd;border:1px solid #b8d8f0;border-radius:8px;padding:12px;margin:10px 0;font-size:13px}
.hb.w{background:#fff7ed;border-color:#fed7aa}
.btn-sm{display:inline-block;padding:10px 20px;margin:4px 0;background:#eef1f5;color:#555;border:none;border-radius:8px;font-size:13px;cursor:pointer}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #ddd;border-top-color:#2969a8;border-radius:50%;animation:spin .8s linear infinite;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:400px){.radio-row .ropt{min-width:60px;padding:8px 12px;font-size:13px}.card{padding:18px 14px;margin:10px 8px}.header h1{font-size:19px}}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>🇺🇸 美国移民项目资格评估</h1><p>基于USCIS 2025-2026政策 · 约3分钟</p></div>

<form id="qform">

<div class="card"><h2><span class="num">1</span> 基本信息</h2>
<div class="fg"><label class="q">年龄</label><select id="age"><option value="">请选择</option><option value="18-30">18-30岁</option><option value="31-40">31-40岁</option><option value="41-50">41-50岁</option><option value="51+">51岁及以上</option></select></div>
<div class="fg"><label class="q">国籍/身份</label><select id="nationality"><option value="">请选择</option><option value="cn">中国籍（未取得外国永居）</option><option value="cn-foreign">中国籍+已取得外国永居</option><option value="foreign">外国国籍</option></select></div>
<div class="fg"><label class="q">是否有无犯罪记录<span class="hint">(选择“是”表示无犯罪记录；所有美国移民项目均要求无犯罪记录)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="nocrim" value="yes"> 是</label><label class="ropt"><input type="radio" name="nocrim" value="no"> 否</label></div></div>
<div class="fg"><label class="q">是否有健康证明<span class="hint">(选择“是”表示无重大传染性疾病；美国移民体检I-693要求)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="health" value="yes"> 是</label><label class="ropt"><input type="radio" name="health" value="no"> 否</label></div></div>
</div>

<div class="card"><h2><span class="num">2</span> 学历背景</h2>
<div class="fg"><label class="q">最高学历</label><select id="education"><option value="">请选择</option><option value="doctor">博士</option><option value="master">硕士</option><option value="bachelor">学士（本科）</option><option value="associate">大专/副学士</option><option value="highschool">高中及以下</option></select></div>
<div class="fg" id="fg-field" style="display:none"><label class="q">硕/博士专业领域</label><select id="phd_field"><option value="">请选择</option><option value="stem">STEM（科学/技术/工程/数学）</option><option value="business">商业/金融/管理</option><option value="medical">医学/生命科学</option><option value="law">法律</option><option value="arts">艺术/人文/社科</option><option value="other">其他</option></select></div>
<div class="fg"><label class="q">是否持有美国学位<span class="hint">(本科及以上)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="usdegree" value="yes"> 是</label><label class="ropt"><input type="radio" name="usdegree" value="no"> 否</label></div>
<div id="dt-usdegree" class="detail-input"><span class="label-sm">美国院校及学位：</span><input type="text" id="usdegree-name" placeholder="例如：Stanford University Master of CS"></div></div>
</div>

<div class="card"><h2><span class="num">3</span> 工作与成就</h2>
<div class="fg"><label class="q">总工作经验年限</label><select id="workyears"><option value="">请选择</option><option value="0-2">0-2年</option><option value="3-5">3-5年</option><option value="5-9">5-9年</option><option value="10+">10年及以上</option></select></div>
<div class="fg"><label class="q">是否担任过管理/行政职位<span class="hint">(经理、总监、VP、CXO等，管理团队或组织)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="manager" value="yes"> 是</label><label class="ropt"><input type="radio" name="manager" value="no"> 否</label></div>
<div id="dt-manager" class="detail-input"><span class="label-sm">职位及时长：</span><input type="text" id="manager-info" placeholder="例如：技术总监 3年 / 事业部VP 5年"></div></div>
<div class="fg"><label class="q">是否在跨国公司/海外有分支机构的企业工作<span class="hint">(含中国公司海外分支、外企在华子公司等)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="mnc" value="yes"> 是</label><label class="ropt"><input type="radio" name="mnc" value="no"> 否</label></div>
<div id="dt-mnc" class="detail-input"><span class="label-sm">公司及在职年限：</span><input type="text" id="mnc-info" placeholder="例如：Google中国 高级工程师 2年"></div></div>

<h3 class="sub">🎖️ 杰出成就评估（EB-1A 10选3标准）</h3>
<div class="fg"><label class="q">是否获得过全国性或国际性重要奖项？<span class="hint">(行业大奖、国家级荣誉等)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="eb1a_awards" value="yes"> 是</label><label class="ropt"><input type="radio" name="eb1a_awards" value="no"> 否</label></div>
<div id="dt-awards" class="detail-input"><span class="label-sm">奖项名称：</span><input type="text" id="awards-info" placeholder="例如：国家科技进步奖 / 红点设计奖"></div></div>
<div class="fg"><label class="q">是否属于要求杰出成就的专业协会会员？<span class="hint">(需经遴选入会，非普通付费会员)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="eb1a_membership" value="yes"> 是</label><label class="ropt"><input type="radio" name="eb1a_membership" value="no"> 否</label></div>
<div id="dt-membership" class="detail-input"><span class="label-sm">协会名称：</span><input type="text" id="membership-info" placeholder="例如：IEEE Fellow / 中国工程院院士"></div></div>
<div class="fg"><label class="q">是否曾被主要媒体报道过？<span class="hint">(主流媒体对你个人或工作的专题报道)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="eb1a_media" value="yes"> 是</label><label class="ropt"><input type="radio" name="eb1a_media" value="no"> 否</label></div>
<div id="dt-media" class="detail-input"><span class="label-sm">媒体名称：</span><input type="text" id="media-info" placeholder="例如：华尔街日报 / 央视"></div></div>
<div class="fg"><label class="q">是否曾担任专业领域评审/评委？<span class="hint">(论文审稿、项目评审、比赛评委等)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="eb1a_judging" value="yes"> 是</label><label class="ropt"><input type="radio" name="eb1a_judging" value="no"> 否</label></div></div>
<div class="fg"><label class="q">是否有原创性重大贡献？<span class="hint">(专利、核心技术、原创理论、行业标准等)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="eb1a_original" value="yes"> 是</label><label class="ropt"><input type="radio" name="eb1a_original" value="no"> 否</label></div>
<div id="dt-original" class="detail-input"><span class="label-sm">简述贡献：</span><input type="text" id="original-info" placeholder="例如：5项发明专利 / 行业标准制定"></div></div>
<div class="fg"><label class="q">是否在专业期刊发表过学术文章？<span class="hint">(SCI/EI论文、行业核心期刊等)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="eb1a_publications" value="yes"> 是</label><label class="ropt"><input type="radio" name="eb1a_publications" value="no"> 否</label></div></div>
<div class="fg"><label class="q">是否在知名机构担任领导或关键角色？<span class="hint">(上市公司/知名机构的高管、首席科学家等)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="eb1a_leading" value="yes"> 是</label><label class="ropt"><input type="radio" name="eb1a_leading" value="no"> 否</label></div></div>
<div class="fg"><label class="q">薪资/收入是否显著高于同行？<span class="hint">(同行业同地区前10%水平)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="eb1a_salary" value="yes"> 是</label><label class="ropt"><input type="radio" name="eb1a_salary" value="no"> 否</label></div></div>
</div>

<div class="card"><h2><span class="num">4</span> 资产与投资能力</h2>
<div class="fg"><label class="q">家庭净资产<span class="hint">(合并计算，美元)</span></label><select id="networth"><option value="">请选择</option><option value="lt500k">低于50万美元（约365万人民币）</option><option value="500k-1m">50万-100万美元（约365-730万人民币）</option><option value="1m-5m">100万-500万美元（约730-3,650万人民币）</option><option value="gte5m">500万美元及以上（约3,650万人民币以上）</option></select></div>
<div class="fg"><label class="q">是否拥有业务实体？<span class="hint">(持股≥50%的公司或合伙企业)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="bizowner" value="yes"> 是</label><label class="ropt"><input type="radio" name="bizowner" value="no"> 否</label></div>
<div id="fg-bizdetail" style="display:none"><label class="q">业务类型及规模</label><select id="bizscale"><option value="">请选择</option><option value="small">小型（年营收<$50万）</option><option value="medium">中型（年营收$50万-$500万）</option><option value="large">大型（年营收>$500万）</option></select></div></div>
</div>

<div class="card" id="card-e2" style="display:none"><h2><span class="num">5</span> E-2 条约国相关<span class="hint" style="display:inline;font-weight:400">(中国籍申请人专项)</span></h2>
<div class="fg"><label class="q">是否持有第三国（E-2条约国）国籍？<span class="hint">(如：格林纳达、土耳其、葡萄牙、韩国、日本、加拿大等80+国家。中国大陆不是条约国)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="e2_citizen" value="yes"> 是，已获得</label><label class="ropt"><input type="radio" name="e2_citizen" value="no"> 否</label><label class="ropt"><input type="radio" name="e2_citizen" value="plan"> 计划申请中</label></div>
<div id="dt-e2" class="detail-input"><span class="label-sm">条约国名称及获取时间：</span><input type="text" id="e2-info" placeholder="例如：格林纳达 2024年 / 土耳其 投资入籍"></div></div>
</div>

<div class="card"><h2><span class="num">6</span> 美国雇主/公司情况</h2>
<div class="fg"><label class="q">是否已获得美国雇主工作邀约(Job Offer)？</label><div class="radio-row"><label class="ropt"><input type="radio" name="usemp" value="yes"> 是，已获得</label><label class="ropt"><input type="radio" name="usemp" value="no"> 否</label><label class="ropt"><input type="radio" name="usemp" value="plan"> 计划寻找/自雇创业</label></div></div>
<div class="fg"><label class="q">现雇主是否有美国关联公司/办事处？<span class="hint">(用于L-1跨国高管调动)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="usa_affiliate" value="yes"> 是</label><label class="ropt"><input type="radio" name="usa_affiliate" value="no"> 否</label></div>
<div id="dt-affiliate" class="detail-input"><span class="label-sm">美国公司名称：</span><input type="text" id="affiliate-info" placeholder="例如：Apple Inc. / 腾讯美国"></div></div>
<div class="fg"><label class="q">在现雇主工作是否已满1年？<span class="hint">(L-1要求过去3年内至少1年在海外关联公司工作)</span></label><div class="radio-row"><label class="ropt"><input type="radio" name="employ1yr" value="yes"> 是</label><label class="ropt"><input type="radio" name="employ1yr" value="no"> 否</label></div></div>
</div>

<div class="card"><h2><span class="num">7</span> 语言能力</h2>
<div class="fg"><label class="q">英文水平<span class="hint">(美国移民一般无硬性语言分数要求，但影响申请策略)</span></label><select id="english"><option value="">请选择</option><option value="native">精通（母语/雅思≥7.0/托福≥94）</option><option value="good">良好（雅思≥6.0/托福≥80）</option><option value="basic">一般（雅思≥5.0/托福≥60）</option><option value="none">基础/不会</option></select></div>
</div>

<div class="card"><h2><span class="num">8</span> 移民意向</h2>
<div class="fg"><label class="q">主要移民目的<span class="hint">(可多选)</span></label><div class="radio-row"><label class="ropt"><input type="checkbox" name="purpose" value="work"> 职业发展</label><label class="ropt"><input type="checkbox" name="purpose" value="edu"> 子女教育</label><label class="ropt"><input type="checkbox" name="purpose" value="invest"> 资产配置</label><label class="ropt"><input type="checkbox" name="purpose" value="life"> 生活方式</label><label class="ropt"><input type="checkbox" name="purpose" value="passport"> 绿卡/公民</label></div></div>
<div class="fg"><label class="q">愿意投入的移民预算<span class="hint">(含投资款、律师费、申请费等，美元)</span></label><select id="budget"><option value="">请选择</option><option value="lt100k">低于10万美元（约73万人民币）</option><option value="100k-500k">10万-50万美元（约73-365万人民币）</option><option value="500k-1m">50万-100万美元（约365-730万人民币）</option><option value="gte1m">100万美元及以上（约730万人民币以上）</option></select></div>
</div>

<button type="button" class="btn" onclick="submitForm()">📊 提交评估</button>
</form>

<div class="results-wrap" id="results"></div>
</div>

<script>
(function(){
  var D=document;
  function R(name){var e=D.querySelector('input[name="'+name+'"]:checked');return e?e.value:null;}
  function S(id){var e=D.getElementById(id);return e?e.value:'';}
  function I(id){var e=D.getElementById(id);return e?e.value.trim():'';}
  function Y(v){return v==='yes'?'是':v==='no'?'否':(v||'未填');}
  function L(id,v){
    var m={
      'age':{'18-30':'18-30岁','31-40':'31-40岁','41-50':'41-50岁','51+':'51岁及以上'},
      'nationality':{'cn':'中国籍（未取得外国永居）','cn-foreign':'中国籍+已取得外国永居','foreign':'外国国籍'},
      'education':{'doctor':'博士','master':'硕士','bachelor':'学士（本科）','associate':'大专/副学士','highschool':'高中及以下'},
      'phd_field':{'stem':'STEM','business':'商业/金融/管理','medical':'医学/生命科学','law':'法律','arts':'艺术/人文/社科','other':'其他'},
      'workyears':{'0-2':'0-2年','3-5':'3-5年','5-9':'5-9年','10+':'10年及以上'},
      'networth':{'lt500k':'低于50万美元','500k-1m':'50万-100万美元','1m-5m':'100万-500万美元','gte5m':'500万美元及以上'},
      'bizscale':{'small':'小型（<50万）','medium':'中型（50万-500万）','large':'大型（>500万）'},
      'english':{'native':'精通','good':'良好','basic':'一般','none':'基础/不会'},
      'budget':{'lt100k':'低于10万美元','100k-500k':'10万-50万美元','500k-1m':'50万-100万美元','gte1m':'100万美元及以上'}
    };
    return (m[id]||{})[v]||v;
  }

  // Mobile-safe option buttons: do not rely on native hidden input click/change events
  function selectOption(label){
    var input=label.querySelector('input');
    if(!input)return;
    if(input.type==='radio'){
      input.checked=true;
      var row=label.closest('.radio-row');
      row.querySelectorAll('.ropt').forEach(function(l){l.classList.remove('sel');});
      label.classList.add('sel');
      onChange(input.name,input.value);
    }else if(input.type==='checkbox'){
      input.checked=!input.checked;
      label.classList.toggle('sel',input.checked);
    }
  }
  D.querySelectorAll('.radio-row .ropt').forEach(function(label){
    label.setAttribute('tabindex','0');
    label.addEventListener('touchstart',function(e){selectOption(this);e.preventDefault();}, {passive:false});
    label.addEventListener('mousedown',function(e){selectOption(this);e.preventDefault();});

  window.submitForm=function(){
    var age=S('age'),nat=S('nationality'),nocrim=R('nocrim'),health=R('health');

    var worky=S('workyears'),manager=R('manager'),mnc=R('mnc');

    var budget=S('budget');

    var missing=[];

    if(!nat)missing.push('国籍');
    if(!nocrim)missing.push('犯罪记录');
    if(!health)missing.push('健康');
    if(!edu)missing.push('学历');
    if(!usdegree)missing.push('美国学位');
    if(!worky)missing.push('工作经验');
    if(!manager)missing.push('管理经验');
    if(!mnc)missing.push('跨国公司');
    if(!networth)missing.push('净资产');
    if(!bizowner)missing.push('业务实体');
    if(!usemp)missing.push('美国雇主');
    if(!usaAffiliate)missing.push('关联公司');
    if(!employ1yr)missing.push('在职年限');
    if(!english)missing.push('英文水平');
    if(!budget)missing.push('预算');
    EB1A_FIELDS.forEach(function(f){if(!eb1a[f])missing.push(f==='eb1a_awards'?'奖项':f==='eb1a_membership'?'协会':f==='eb1a_media'?'报道':f==='eb1a_judging'?'评审':f==='eb1a_original'?'贡献':f==='eb1a_publications'?'论文':f==='eb1a_leading'?'领导角色':'高薪');});
    if(nat==='cn'&&!e2Citizen)missing.push('E-2条约国');

    if(missing.length>0){
      alert('请完成以下未填项：\n'+missing.slice(0,8).join('、')+(missing.length>8?' 等共'+missing.length+'项':''));

    var w=D.getElementById('results');
    D.getElementById('qform').style.display='none';
    w.innerHTML='<div class="rs-card" style="text-align:center;padding:50px 20px"><div style="font-size:40px">📤</div><h3>已提交</h3><p style="color:#888;font-size:13px;margin:6px 0"><span class="spinner"></span>正在分析评估...</p></div>';
    w.classList.add('show');w.scrollIntoView({behavior:'smooth'});

    // Remote submit
    var data={
      age:L('age',age), nationality:L('nationality',nat), nocrim:Y(nocrim), health:Y(health),
      education:L('education',edu),
      phd_field:(edu==='master'||edu==='doctor')?L('phd_field',phdField):'不适用',
      usdegree:Y(usdegree)+(usdegree==='yes'?'('+I('usdegree-name')+')':''),
      workyears:L('workyears',worky),

      mnc:Y(mnc)+(mnc==='yes'?'('+I('mnc-info')+')':''),
      eb1a_awards:Y(eb1a.eb1a_awards)+(eb1a.eb1a_awards==='yes'?'('+I('awards-info')+')':''),
      eb1a_membership:Y(eb1a.eb1a_membership)+(eb1a.eb1a_membership==='yes'?'('+I('membership-info')+')':''),
      eb1a_media:Y(eb1a.eb1a_media)+(eb1a.eb1a_media==='yes'?'('+I('media-info')+')':''),
      eb1a_judging:Y(eb1a.eb1a_judging),
      eb1a_original:Y(eb1a.eb1a_original)+(eb1a.eb1a_original==='yes'?'('+I('original-info')+')':''),
      eb1a_publications:Y(eb1a.eb1a_publications),
      eb1a_leading:Y(eb1a.eb1a_leading),
      eb1a_salary:Y(eb1a.eb1a_salary),
      networth:L('networth',networth),
      bizowner:Y(bizowner)+(bizowner==='yes'?' 规模:'+L('bizscale',bizscale):''),
      e2_citizen:(nat==='cn')?{yes:'是'+'('+I('e2-info')+')',no:'否',plan:'计划申请中('+I('e2-info')+')'}[e2Citizen]||'未填':'非中国籍，不适用',
      usemp:{yes:'已获聘用',no:'否',plan:'寻找/自雇'}[usemp]||usemp,

      employ1yr:Y(employ1yr),
      english:L('english',english),
      budget:L('budget',budget)
    };
    var ps=[];D.querySelectorAll('input[name="purpose"]:checked').forEach(function(c){
      var m={work:'职业发展',edu:'子女教育',invest:'资产配置',life:'生活方式',passport:'绿卡/公民'};

    fetch('https://formsubmit.co/ajax/1104890128@qq.com',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).catch(function(){});

    setTimeout(function(){showResults(age,nat,nocrim,health,edu,phdField,usdegree,worky,manager,mnc,eb1a,networth,bizowner,bizscale,e2Citizen,usemp,usaAffiliate,employ1yr,english,budget);},2000);

  function showResults(age,nat,nocrim,health,edu,phdField,usdegree,worky,manager,mnc,eb1a,networth,bizowner,bizscale,e2Citizen,usemp,usaAffiliate,employ1yr,english,budget){
    if(nocrim==='no'){
      D.getElementById('results').innerHTML='<div class="rs-card" style="border-left:4px solid #ef4444"><h3>⚠️ 评估结果</h3><p style="color:#991b1b;font-weight:600">有犯罪记录——所有美国移民项目均要求无犯罪记录。建议先咨询移民律师评估记录的影响程度。</p><button class="btn-sm" onclick="goBack()">✏️ 返回修改</button></div>';
      return;
    }

    // Count EB-1A criteria met
    var eb1aCount=0; EB1A_FIELDS.forEach(function(f){if(eb1a[f]==='yes')eb1aCount++;});
    var isAdvancedDegree=(edu==='doctor'||edu==='master');
    var isBachelor=(edu==='bachelor');

    var hasUSAEmployer=(usemp==='yes');
    var hasUSAffiliate=(usaAffiliate==='yes');
    var netHigh=(networth==='1m-5m'||networth==='gte5m');
    var netMid=(networth==='500k-1m');
    var budgetHigh=(budget==='500k-1m'||budget==='gte1m');
    var budgetMid=(budget==='100k-500k');
    var budgetLow=(budget==='lt100k');
    var isCN=(nat==='cn');
    var hasE2Passport=!isCN||(e2Citizen==='yes');
    var isExceptionalAbility=(worky==='5-9'||worky==='10+')&&eb1aCount>=2;

    // EB-5 eligibility
    var eb5Ok=netHigh&&nocrim==='yes';
    var eb5Maybe=netMid&&nocrim==='yes';
    var eb5TEA=(netHigh||netMid)&&nocrim==='yes'; // TEA only needs $800K

    // EB-1A eligibility: 3+ criteria
    var eb1aOk=eb1aCount>=3;
    var eb1aMaybe=eb1aCount>=2;

    // EB-2 NIW eligibility
    var niwOk=isAdvancedDegree||(isBachelor&&isExceptionalAbility);
    var niwWithSTEM=isAdvancedDegree&&hasStemPhD;

    // E-2 eligibility
    var e2Ok=hasE2Passport&&(budgetHigh||budgetMid);
    var e2Maybe=hasE2Passport&&budgetLow;
    var e2Blocked=isCN&&!hasE2Passport;

    // L-1 eligibility
    var l1Ok=hasUSAffiliate&&hasManager&&has1yrEmploy;
    var l1Maybe=hasUSAffiliate&&has1yrEmploy&&!hasManager;
    var l1aVsL1b=hasManager?'L-1A（高管，7年）':'L-1B（专才，5年）';

    // H-1B eligibility
    var h1bOk=(isAdvancedDegree||isBachelor)&&hasUSAEmployer;
    var h1bMaybe=(isAdvancedDegree||isBachelor)&&!hasUSAEmployer;
    var h1bAdvantage=isAdvancedDegree&&hasUSAEmployer;

    // Build result programs
    var eb5Status=eb5Ok?'q':(eb5Maybe?'m':'n');
    var eb5Detail=eb5Ok?'<span class="g">✅ 符合</span><br>净资产满足EB-5投资要求。<br>TEA项目（目标就业区/基建）：最低<b>$800,000</b>（约584万人民币）。非TEA：<b>$1,050,000</b>（约767万人民币）。<br>需证明资金来源合法+创造<b>10个全职就业</b>。获批后获<b>2年有条件绿卡</b>→I-829转<b>10年永绿</b>。':(eb5Maybe?'<span class="o">⚠️ 可能符合</span><br>净资产在$50-100万区间。TEA项目最低$800,000，需确认资产流动性是否满足。剩余资金需覆盖生活/管理费等。':'❌ 净资产不足。EB-5最低投资额$800,000（TEA项目），当前资产偏低。');

    var eb1aStatus=eb1aOk?'q':(eb1aMaybe?'m':'n');
    var eb1aDetail=eb1aOk?('<span class="g">✅ 符合（'+eb1aCount+'/8项）</span><br>满足EB-1A 10选3标准。<br><b>核心优势：无需雇主担保</b>，可自行申请I-140，加急处理(PP)15天出结果。<br>排期（2026.6）：Final Action Date <b>2023年4月1日</b>。直接绿卡。'):(eb1aMaybe?('<span class="o">⚠️ 接近（'+eb1aCount+'/8项，需≥3）</span><br>差1项即可满足EB-1A标准。建议补充：<br>· 增加论文发表或评审经历<br>· 寻求媒体报道或行业奖项<br>· 整理专利/商业成功证据'):('<span class="o">❌ 不符合（'+eb1aCount+'/8项）</span><br>当前成就较少，EB-1A需要持续积累。可先考虑EB-2 NIW路径。'));

    var niwStatus=niwOk?'q':(isBachelor?'m':'n');
    var niwDetail=niwOk?('<span class="g">✅ 符合</span><br>'+(isAdvancedDegree?'<b>高级学位路径</b>（硕士/博士）。':'<b>杰出能力路径</b>（本科+显著经验）。')+'<br>需满足Dhanasar三要素：①事业有实质价值和国家重要性 ②申请人有能力推进 ③豁免劳工证对美国有利。<br><b>无需雇主担保</b>，直接绿卡。排期关注I-485。'+(niwWithSTEM?'<br><span class="g">🎯 STEM背景加分</span>——USCIS对STEM领域NIW认可度较高。':'')):(isBachelor?'<span class="o">⚠️ 有条件</span><br>本科学位申请NIW需证明"杰出能力"+满足Dhanasar标准+国家重要性。建议积累工作经验/发表/专利后再申请。':'<span class="o">❌ 不符合</span><br>NIW要求硕士以上学位或本科学位+杰出能力。建议先提升学历或走其他路径。');

    var e2Status=e2Ok?'q':(e2Maybe?'m':(e2Blocked?'n':'m'));
    var e2Detail=e2Ok?('<span class="g">✅ 符合</span><br>'+(isCN?('已取得第三国条约护照（'+I('e2-info')+'），满足E-2条约国要求。<br>'):'非中国籍，属于E-2条约国公民。<br>')+'投资预算满足"实质性投资"门槛（建议≥$100,000）。<br><b>注意：非移民签证</b>，不可直接转绿卡。需通过EB-5/EB-1C/L-1/亲属移民间接转。<br>可无限续签，但须保持非移民意图。'):(e2Maybe?('<span class="o">⚠️ 有条件</span><br>条约国条件满足，但投资预算偏低（<$100,000）。E-2虽无固定最低额，但需"与业务成比例的实质性投资"。'):(e2Blocked?'❌ 不符合。<br>中国籍申请人须先取得<b>E-2条约国国籍</b>（如格林纳达CBI/土耳其/葡萄牙/韩国等）。<br>可考虑先通过投资入籍获取第三国护照，再申请E-2。':'⚠️ 请确认是否为E-2条约国（80+国家）。'));

    var l1Status=l1Ok?'q':(l1Maybe?'m':'n');
    var l1Detail=l1Ok?('<span class="g">✅ 符合</span><br>现雇主有美国关联公司+已工作≥1年+担任管理职务。<br>可申请<b>L-1A</b>（高管/经理），最长<b>7年</b>。配偶可申L-2工卡自由工作。<br>L-1A 1年后可通过<b>EB-1C跨国高管</b>申请绿卡（与EB-1A共用排期）。'):(l1Maybe?('<span class="o">⚠️ 有条件</span><br>有美国关联公司+在职≥1年，但非管理岗——可申请<b>L-1B（专才，最长5年）</b>。配偶也可获工卡。<br>L-1B转绿卡较难，需走EB-2/EB-3雇主担保路径。'):'❌ 不符合。需满足：在跨国公司海外分支工作≥1年+美国有关联公司+管理/专才职位。');

    var h1bStatus=h1bOk?'q':(h1bMaybe?'m':'n');
    var h1bDetail=h1bOk?('<span class="g">✅ 符合资格</span><br>学历满足+已获美国雇主Offer。<br><b>⚠️ H-1B需抽签</b>（年度85,000名额），中签率约<b>15-30%</b>。'+(isAdvancedDegree?'<br><span class="g">🎯 硕博优势</span>——可参与额外20,000个高级学位豁免名额，中签率提高。':'')+'<br>签证<b>双重意图</b>——可在H-1B期间由雇主发起绿卡申请(EB-2/EB-3 PERM→I-140→I-485)。全程3-8年。'):(h1bMaybe?'<span class="o">⚠️ 学历满足但不具备雇主Offer</span><br>H-1B需要美国雇主担保。可先寻找美国雇主→抽签→通过后赴美。名校STEM可享3年OPT→增加抽签机会。':'❌ 学历或雇主不满足。H-1B需学士以上学位+美国雇主专业职位Offer。');

    // Special: show H-1B note about lottery
    if(h1bOk)h1bDetail+='<br><span style="color:#c2410c;font-size:12px">⚠️ FY2027抽签已改革为"一人一签"制度(beneficiary-centric)，减少作弊，真实中签率提升。</span>';

    var pg=[
      {n:'EB-1A 杰出人才',s:eb1aStatus,d:eb1aDetail},
      {n:'EB-2 NIW 国家利益豁免',s:niwStatus,d:niwDetail},
      {n:'EB-5 投资移民',s:eb5Status,d:eb5Detail},
      {n:'E-2 条约国投资者',s:e2Status,d:e2Detail},
      {n:'L-1 跨国高管/专才',s:l1Status,d:l1Detail},
      {n:'H-1B 工作签证',s:h1bStatus,d:h1bDetail},
    ];

    var ord={q:0,m:1,n:2};
    pg.sort(function(a,b){return ord[a.s]-ord[b.s];});
    var qp=pg.filter(function(p){return p.s==='q';});
    var mp=pg.filter(function(p){return p.s==='m';});

    var h='<div class="rs-card" style="border-left:4px solid #22c55e"><h3>📊 评估结果</h3>';
    var wh='';
    if(health==='no')wh='<p style="color:#c2410c;font-size:13px;margin:4px 0">⚠️ 健康项选"有"——美国I-693体检可能拒签特定传染病。建议咨询移民体检医生。</p>';
    if(e2Blocked)wh+='<p style="color:#c2410c;font-size:13px;margin:4px 0">⚠️ 中国籍申请人E-2需先获取第三国条约护照。</p>';
    if(h1bOk)wh+='<p style="color:#c2410c;font-size:13px;margin:4px 0">⚠️ H-1B受年度配额限制需抽签，非100%保证获批。</p>';

    if(qp.length>0){h+=wh+'<p style="font-size:14px;margin-bottom:6px">🎉 符合 <strong>'+qp.length+'</strong> 个项目：</p>'+qp.map(function(p){return'<span class="tag tg">'+p.n+'</span>';}).join(' ');}
    if(mp.length>0){h+='<p style="font-size:14px;margin:10px 0 6px">⚠️ <strong>'+mp.length+'</strong> 个有条件：</p>'+mp.map(function(p){return'<span class="tag ty">'+p.n+'</span>';}).join(' ');}
    if(qp.length===0&&mp.length===0)h+=wh+'<p style="color:#999">暂未匹配到完全符合条件的项目。</p>';
    h+='</div>';

    // EB-1A criteria detail
    h+='<div class="rs-card"><h3 style="font-size:16px;margin-bottom:14px;color:#1a3350">🎖️ EB-1A 成就评估（'+eb1aCount+'/8项）</h3>';
    var critLabels={'eb1a_awards':'全国/国际奖项','eb1a_membership':'杰出成就协会','eb1a_media':'主流媒体报道','eb1a_judging':'专业评审经历','eb1a_original':'原创性重大贡献','eb1a_publications':'学术文章发表','eb1a_leading':'领导关键角色','eb1a_salary':'薪资高于同行'};
    EB1A_FIELDS.forEach(function(f){

      h+='<div class="prog '+(met?'el':'no')+'"><h4>'+(met?'✅ ':'⬜ ')+critLabels[f]+'</h4><span class="st '+(met?'st-q':'st-n')+'">'+(met?'✅ 满足':'❌ 未满足')+'</span></div>';
    });
    h+='<div class="hb">💡 需要至少满足<b>3项</b>（10项选3）。</div></div>';

    h+='<div class="rs-card"><h3 style="font-size:16px;margin-bottom:14px;color:#1a3350">📋 逐项分析</h3>';
    pg.forEach(function(p){
      var cl='';if(p.s==='q')cl='el';else if(p.s==='m')cl='mb';else cl='no';
      h+='<div class="prog '+cl+'"><h4>'+p.n+'</h4><span class="st st-'+p.s+'">'+{q:'✅ 符合',m:'⚠️ 有条件',n:'❌ 暂不符合'}[p.s]+'</span><div class="d">'+p.d+'</div></div>';
    });

    // Comparison table
    h+='<table class="cm"><tr><th>项目</th><th>核心门槛</th><th>是否需要雇主</th><th>转绿卡</th><th>排期</th></tr>';
    var rows=[
      ['EB-1A','10项满足3项','❌ 无需','直接绿卡','中国2023.4'],
      ['EB-2 NIW','硕士+/杰出能力','❌ 无需','直接绿卡','有排期'],
      ['EB-5','$80万-105万投资','❌ 无需','2年条件→10年','预留无排期'],
      ['E-2','条约国+实质投资','❌ 自营','不可直接转','N/A'],
      ['L-1A','跨国高管1年','需关联公司','EB-1C 1年后','有排期'],
      ['H-1B','本科+雇主+抽签','需要雇主','PERM→EB类','3-8年'],
    ];
    rows.forEach(function(r){h+='<tr>'+r.map(function(c){return'<td>'+c+'</td>';}).join('')+'</tr>';});
    h+='</table>';

    // Recommendation
    if(qp.length>0){
      h+='<div class="hb">💡 首选推荐：<b>'+qp[0].n+'</b>。原因：'+(qp[0].n==='EB-1A 杰出人才'?'无需雇主担保，直接绿卡，最快审批。':qp[0].n==='EB-2 NIW 国家利益豁免'?'无需雇主，直接绿卡，适合高学历人士。':qp[0].n==='EB-5 投资移民'?'资金充足，预留签证无排期，全家绿卡。':qp[0].n==='E-2 条约国投资者'?'最快赴美路径，可先登陆再规划。':qp[0].n==='L-1 跨国高管/专才'?'现成跨国雇主资源，1年后可转绿卡。':'学历+雇主兼备，但需抽签。')+(qp.length>1?'<br>备选：'+qp.slice(1).map(function(p){return p.n;}).join('、')+'。':'')+'</div>';
    }else if(mp.length>0){
      h+='<div class="hb">💡 最接近项目：<b>'+mp[0].n+'</b>。补齐条件后可申请。'+(mp.length>1?'<br>也可考虑：'+mp.slice(1).map(function(p){return p.n;}).join('、')+'。':'')+'</div>';
    }else{
      h+='<div class="hb">💡 建议路径：①提升学历（硕士+）走EB-2 NIW ②积累成就走EB-1A ③寻找美国雇主走H-1B/L-1 ④资金充足可走EB-5。</div>';
    }

    // Warning for CN + EB-5 approval
    if(eb5Ok&&isCN)h+='<div class="hb w">⚠️ 中国出生申请人EB-5非预留签证有排期（约2015-2016年）。建议选择<b>预留签证类别</b>（乡村/高失业区/基建），目前无排期。</div>';

    h+='<div class="hb w">⚠️ 本评估由AI基于问卷自动生成，仅供参考。实际以USCIS/使领馆审批为准。建议咨询持牌美国移民律师。数据来源：USCIS Policy Manual、2026年6月Visa Bulletin。</div>';
    h+='<button class="btn-sm" onclick="goBack()" style="margin:8px 0">✏️ 返回修改</button>';
    D.getElementById('results').innerHTML=h;
  }
})();
</script>
