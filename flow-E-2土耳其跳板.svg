<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" style="max-width:720px;font-family:system-ui,sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1a365d"/></marker></defs><rect width="720" height="320" fill="#f8fafc" rx="14"/><text x="360" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1a365d">E-2土耳其跳板路径</text><rect x="50" y="45" width="150" height="55" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="125" y="65" text-anchor="middle" font-size="9" font-weight="600">土耳其基金/购房</text><text x="125" y="82" text-anchor="middle" font-size="9" fill="#6b7280">$400K-500K</text><line x1="202" y1="72" x2="238" y2="72" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="240" y="45" width="150" height="55" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="315" y="65" text-anchor="middle" font-size="9" font-weight="600">6-8月获土耳其护照</text><text x="315" y="82" text-anchor="middle" font-size="9" fill="#6b7280">E-2条约国</text><line x1="392" y1="72" x2="428" y2="72" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="430" y="45" width="150" height="55" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="505" y="65" text-anchor="middle" font-size="9" font-weight="600">在美设立/收购企业</text><text x="505" y="82" text-anchor="middle" font-size="9" fill="#6b7280">实质投资运营</text><line x1="582" y1="72" x2="618" y2="72" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="620" y="45" width="80" height="55" rx="10" fill="#e0edf6" stroke="#1a365d" stroke-width="2"/><text x="660" y="72" text-anchor="middle" font-size="9" font-weight="600">E-2签证</text><line x1="660" y1="102" x2="660" y2="135" stroke="#1a365d" stroke-width="1.5"/><line x1="660" y1="135" x2="46" y2="135" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="50" y="110" width="200" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="150" y="130" text-anchor="middle" font-size="10" font-weight="600">⚠️前提1:土籍≥3年居住</text><text x="150" y="148" text-anchor="middle" font-size="9" fill="#78716c">PL 117-263要求</text><line x1="252" y1="135" x2="288" y2="135" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="290" y="110" width="200" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="390" y="130" text-anchor="middle" font-size="10" font-weight="600">⚠️前提2:实质投资金额</text><text x="390" y="148" text-anchor="middle" font-size="9" fill="#78716c">无最低额但需"实质性"</text><line x1="492" y1="135" x2="528" y2="135" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="530" y="110" width="120" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="590" y="130" text-anchor="middle" font-size="10" font-weight="600">⚠️非移民签证</text><text x="590" y="148" text-anchor="middle" font-size="9" fill="#78716c">不定向绿卡</text><line x1="590" y1="162" x2="590" y2="195" stroke="#1a365d" stroke-width="1.5"/><line x1="590" y1="195" x2="46" y2="195" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="50" y="170" width="250" height="50" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="175" y="190" text-anchor="middle" font-size="10" font-weight="600">准备商业计划+DS-160</text><text x="175" y="208" text-anchor="middle" font-size="9" fill="#6b7280">3-4周</text><line x1="302" y1="195" x2="338" y2="195" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="340" y="170" width="250" height="50" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="465" y="190" text-anchor="middle" font-size="10" font-weight="600">使领馆面签→获批E-2</text><text x="465" y="208" text-anchor="middle" font-size="9" fill="#6b7280">首次2-5年</text></svg>
