<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" style="max-width:720px;font-family:system-ui,sans-serif"><defs><marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1a365d"/></marker></defs><rect width="720" height="340" fill="#f8fafc" rx="14"/><text x="360.0" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1a365d">NIW国家利益豁免</text><rect x="50" y="50" width="180" height="50" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="140" y="70" text-anchor="middle" font-size="11" font-weight="600">1.评估Dhanasar三要素</text><text x="140" y="88" text-anchor="middle" font-size="10" fill="#6b7280">1-2周</text><line x1="234" y1="75" x2="266" y2="75" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="270" y="50" width="180" height="50" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="360" y="70" text-anchor="middle" font-size="11" font-weight="600">2.准备推荐信(5-10封)</text><text x="360" y="88" text-anchor="middle" font-size="10" fill="#6b7280">4-8周</text><line x1="454" y1="75" x2="486" y2="75" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="490" y="50" width="180" height="50" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="580" y="70" text-anchor="middle" font-size="11" font-weight="600">3.撰写申请书+证据包</text><text x="580" y="88" text-anchor="middle" font-size="10" fill="#6b7280">4-8周</text><line x1="580" y1="102" x2="580" y2="155" stroke="#1a365d" stroke-width="1.5"/><line x1="580" y1="155" x2="46" y2="155" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="50" y="130" width="180" height="50" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="140" y="150" text-anchor="middle" font-size="11" font-weight="600">4.提交I-140</text><text x="140" y="168" text-anchor="middle" font-size="10" fill="#6b7280">1周</text><line x1="234" y1="155" x2="266" y2="155" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="270" y="130" width="180" height="50" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="360" y="150" text-anchor="middle" font-size="11" font-weight="600">5.USCIS审理</text><text x="360" y="168" text-anchor="middle" font-size="10" fill="#6b7280">6-12月</text><line x1="454" y1="155" x2="486" y2="155" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="490" y="130" width="180" height="50" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="580" y="150" text-anchor="middle" font-size="11" font-weight="600">6.I-140获批</text><text x="580" y="168" text-anchor="middle" font-size="10" fill="#6b7280">—</text><line x1="580" y1="182" x2="580" y2="235" stroke="#1a365d" stroke-width="1.5"/><line x1="580" y1="235" x2="46" y2="235" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="50" y="210" width="180" height="50" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="140" y="230" text-anchor="middle" font-size="11" font-weight="600">7.等排期+I-485调整</text><text x="140" y="248" text-anchor="middle" font-size="10" fill="#6b7280">1-2年</text><line x1="234" y1="235" x2="266" y2="235" stroke="#1a365d" stroke-width="1.5" marker-end="url(#a)"/><rect x="270" y="210" width="180" height="50" rx="10" fill="#fff" stroke="#1a365d" stroke-width="1.5"/><text x="360" y="230" text-anchor="middle" font-size="11" font-weight="600">8.面试+获绿卡</text><text x="360" y="248" text-anchor="middle" font-size="10" fill="#6b7280">—</text></svg>