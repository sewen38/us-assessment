# 美国移民执行策划案

> 生成日期：2026-06-09
> 适用对象：拟通过美国移民路径取得美国永久居民身份（绿卡）的中国内地家庭/企业主/专业人士
> 文档版本：客户交付版 V1.0
> 重要声明：本策划案为商业规划与执行框架，不构成法律、税务、投资或移民建议；落地前须由美国持牌移民律师进行最终确认。本方案中的"身份规划"指取得美国永久居民身份（绿卡）及后续公民身份（如适用），涉及国籍变更须申请人自愿且满足法定条件。

---

## 摘要结论

本方案建议客户以美国移民路径为主路径，根据客户背景在以下六大通道中精准匹配：

- **EB-5投资移民**（TEA $80万/非TEA $105万，2022年RIA法案）——适合高净值投资人，RIA预留签证类别（乡村/高失业区/基建）当前无排期
- **EB-1A杰出人才**（10项中满足3项，无需雇主）——适合各领域顶尖人才，中国排期约2023年4月
- **EB-2 NIW国家利益豁免**（Dhanasar三要素，STEM/专业人士）——适合硕博/研究人员，中国有排期
- **L-1A/EB-1C跨国高管**（海外企业高管调任美国）——适合在中国已拥有企业的企业主，可绕过排期快速赴美
- **E-2条约国投资者**（须先取得条约国护照，如土耳其/格林纳达）——非移民签证，可无限续签，适合中等预算
- **O-1A杰出能力非移民**（需美国雇主/项目方）——可快速登陆，作为EB-1A/NIW的前哨桥接

美国绿卡的核心价值：**全球最大经济体的生活与工作自由**、顶级教育资源（K-12免费公立+州内大学学费）、免签180+国家的美国护照（入籍后）、无移民监（每次离境不超过6个月即可）、全球资产配置枢纽。

本方案执行重点：第一，精准匹配移民通道；第二，资金来源合规贯穿始终；第三，排期管理与节奏把控；第四，税务规划——美国全球征税（基于税务居民身份，非基于绿卡持有者自动全球征税）。

### 1.3 根本判断

**表面问题**：客户想办一个美国绿卡。

**真实问题**：客户需要一个全球最大经济体的永久居留权，以解决子女教育（免费K-12+州内大学学费+顶级高校录取优势）、资产全球配置（美元资产+美国资本市场）、事业发展（美国市场准入+创业生态+职业空间）三大需求。核心矛盾在于：排期等待时间（2-8年不等）+美国全球征税义务 vs 客户对时间效率和税务后果的容忍度。

## 二、核心策略

### 2.1 三分离定位

| 维度 | 美国方案中的定位 | 判断 |
|---|---|---|
| 事业国 | 中国/美国双线 | 美国可作为北美业务总部、研发中心、上市平台或新市场 |
| 居住国 | 美国为主+中国探亲 | 绿卡需证明在美实际居住；每次离境不超过6个月 |
| 福利国 | 美国公立教育/医疗体系 | K-12免费公立、州内大学学费远低于国际生；医保需自行购买 |
| 管钱地 | 美国/离岸双轨 | 美元资产配置、美股/房产投资、家族信托/LLC架构 |
| 功能性身份 | 美国绿卡→可选美国护照 | 绿卡即享在美自由工作/生活/经商；入籍后180+国免签 |

### 2.2 六大路径选择矩阵

| 路径 | 适合人群 | 核心条件 | 审批时间 | 排期 | 直接绿卡 | 推荐优先级 |
|---|---|---|---|---|---|---|
| EB-5预留类 | 高净值（$80万可用） | 合法来源$80万+TEA项目+10就业 | I-526E 1-2年+ I-485 | 无排期(Current) | ✅ 条件绿卡 | ★★★★★ |
| EB-5非预留类 | 高净值（$105万+） | 合法来源$105万+10就业 | 4-6年（含排期） | 中国~2015年 | ✅ 条件绿卡 | ★★★ |
| EB-1A | 各领域杰出人才 | 10项满足3项 | I-140加急15天+I-485 | 中国~2023/4 | ✅ 直接绿卡 | ★★★★★ |
| EB-2 NIW | STEM/专业人士/硕博 | Dhanasar三要素 | I-140 6-12月+I-485 | 中国有排期 | ✅ 直接绿卡 | ★★★★ |
| L-1A/EB-1C | 企业主/高管 | 海外公司高管+美国关联公司 | L-1 1-3月/EB-1C 6-12月 | 排期短 | ✅ EB-1C绿卡 | ★★★★ |
| E-2 | 中等预算+条约国护照 | 条约国国籍+实质性投资 | 2-4月 | 无排期 | ❌ 非移民 | ★★★ |
| O-1A | 杰出能力+有美国项目 | 8项满足3项+美国雇主 | 加急15天 | 无排期 | ❌ 非移民 | ★★★ |

### 2.3 推荐核心路线

**推荐方案A：EB-5投资移民（预留类别·RIA新法）——高净值客户首选。**

理由：
1. **当前无排期（Current）**：2026年6月签证公告显示，EB-5预留签证类别（乡村/高失业区/基建项目）全部"Current"，中国申请人可双递交I-526E+I-485，最快1-2年获批条件绿卡。
2. **全家同行**：主申请人+配偶+21岁以下未婚子女同步获批条件绿卡。
3. **无学历/语言/雇主/管理经验要求**：仅需合法资金来源+投资创造就业。
4. **双递交优势**：在美持有合法身份者可同时递交I-485调整身份+I-765工卡+I-131回美证，3-6个月获工作+旅行许可。
5. **投资门槛**：TEA项目$80万（约¥584万）；非TEA$105万（约¥767万）。
6. **转永久绿卡**：2年条件绿卡到期前90天提交I-829→获批10年无条件绿卡→第5年可申请入籍。

**推荐方案B：EB-1A杰出人才——专业人士首选。**

理由：
1. **无需雇主/劳工证**：可自行申请，自由职业/创业均可。
2. **审批最快**：Premium Processing加急$2,805，15天出I-140结果。
3. **直接10年绿卡**：无"条件绿卡"阶段，一步到位。
4. **配偶+21岁以下子女同行**：同步获批绿卡。
5. **⚠️ 中国排期约3年**：I-140获批后，Priority Date约2023年4月，等待I-485排期约2-3年。

**推荐方案C：EB-2 NIW国家利益豁免——STEM/专业人士路径。**

适合硕博或具备"杰出能力"的STEM/研究/商业人士。Dhanasar三要素：①事业具有实质价值和国家重要性；②申请人有能力推进事业；③免除劳工证对美国有利。I-140加急15天出结果。

**推荐方案D：L-1A/EB-1C跨国高管——企业主最佳路径。**

理由：
1. **快速登陆美国**：L-1A签证审批1-3个月，可携全家赴美。
2. **绕过排期**：L-1A→EB-1C绿卡，排期远短于EB-5非预留类。
3. **全家受益**：L-2配偶可申请EAD工卡自由工作；子女免费入读公立学校。
4. **前提条件**：申请人须在过去3年内至少1年在海外关联公司担任高管/经理职。

**推荐方案E：E-2条约国投资者——中等预算非移民方案。**

理由：
1. **无排期**：非移民签证，审批2-4个月。
2. **投资灵活**：无固定最低额（通常$10万+），企业类型自由。
3. **无限续签**：只要企业经营持续符合条件。
4. **⚠️ 前提**：中国籍须先取得E-2条约国护照（土耳其CBI约$40万，3-6月；格林纳达CBI约$15万）。
5. **⚠️ 不能直接转绿卡**：E-2为非移民签证，后续需通过EB-5/EB-1C/EB-2/亲属移民转绿卡。

**推荐方案F：O-1A杰出能力非移民——绿卡前哨桥接方案。**

理由：
1. **快速登陆**：Premium Processing 15天出结果，首次最长3年。
2. **证据共用**：O-1A证据材料与EB-1A高度重合，O-1A获批可强化后续EB-1A申请。
3. **需要美国雇主/代理人/项目**：不能纯自雇无项目。
4. **可与EB-1A/NIW并行**：O-1A先赴美工作→同步准备EB-1A→排期到时I-485调整身份。

## 三、合规清理详细方案

### 3.1 资金来源合规（EB-5核心）

USCIS对EB-5资金来源审查极其严格，须以"优势证据"（preponderance of evidence）标准完整追溯资金从原始来源→中间环节→最终投资账户的完整链条。

| 环节 | 合规要求 | 风险点 | 执行动作 |
|---|---|---|---|
| 资金来源识别 | 清晰认定资金来源类别：工资/分红/股权转让/房产出售/赠与/继承/贷款 | 混合来源、无法追溯 | 逐笔资金认定来源类别 |
| 工资收入 | 近5-7年完税证明+银行流水+雇主证明信+劳动合同 | 现金工资、无纳税记录 | 准备I-9/W-2/社保缴纳记录+银行入账记录 |
| 企业分红 | 企业审计报告（近5年）+股东会分红决议+银行入账记录+企业完税证明 | 未分配利润不足、无正式决议 | 确保审计报告中累计留存收益≥分红金额 |
| 股权转让 | 股权转让协议+工商变更登记+受让方资金来源+银行转账记录+股权估值报告 | 关联交易、低价转让 | 第三方估值报告+交易对价入账记录 |
| 房产出售 | 购房合同+房产证+完税证明+买卖合同+银行入账+评估报告 | 继承/赠与房产无原始来源 | 追溯到购房时的资金来源 |
| 合法贷款 | 贷款协议+抵押登记+银行放款凭证+还款计划 | 无抵押信用贷款（USCIS不认可） | 必须有抵押品且用申请人自有资产抵押 |
| 赠与 | 赠与协议+赠与人资金来源完整证明+赠与人身份/关系证明 | 赠与人来源不清 | 须提交赠与人全套资金合法来源文件 |
| 资金出境 | 合规渠道（ODI/境外存量/境外分红/合规换汇）+完整银行转账记录 | 地下钱庄、虚假贸易 | 每一笔跨境转账保留完整银行SWIFT记录 |
| 企业KYB审查 | 如资金来自企业：营业执照+审计报告+股权架构+纳税记录+关联交易说明 | 壳公司、虚假经营 | 穿透至最终受益人 |

### 3.1.1 企业KYB（Know Your Business）审查

如果客户资金来源于企业分红/股权转让/利润分配，除个人KYC外还需对企业进行KYB审查：

| 审查项目 | 所需材料 | 用途 |
|---|---|---|
| 企业基本信息 | 营业执照正副本、工商登记信息 | 确认企业合法存续 |
| 财务状况 | 近5年审计报告/财务报表 | 验证盈利能力、留存收益 |
| 股权结构 | 企业股权架构图（穿透至最终受益人） | 确认实际控制人 |
| 纳税合规 | 近5年纳税记录/完税证明 | 验证合法纳税、无逃税 |
| 公司治理 | 股东会/董事会决议（分红/股权转让决议） | 确认资金流出合规性 |
| 经营实质 | 实际经营地、员工人数、主营业务说明 | 排除空壳公司 |
| 关联交易 | 关联方及关联交易说明（如有） | 转让定价合规 |
| 合规记录 | 无重大违法违规证明 | 排除违法经营 |

> ⚠️ 注意：USCIS对EB-5大额投资的资金来源审查会穿透看企业是否合法经营、是否足额纳税、分红是否有足够留存收益支撑。如资金来源为"企业未分配利润分红"，须确保企业审计报告中的留存收益≥分红金额。

### 3.2 中国国籍与绿卡

美国绿卡使人成为美国永久居民（Lawful Permanent Resident），但不等于美国公民：
- 取得绿卡=有在美永久居住和工作的权利，但国籍仍为中国。
- 绿卡持有满5年（公民配偶满3年）可申请入籍美国。
- 中国不承认双重国籍——入籍美国意味自动丧失中国国籍（依据《中华人民共和国国籍法》第9条）。
- 绿卡持有者如在境外连续停留超过1年（或超过回美证有效期），可能被认定为放弃绿卡。
- 离境超过6个月但不足1年者，CBP可能要求解释并评估是否放弃居住意图。

### 3.3 反洗钱与银行KYC

美国银行对KYC/AML要求极其严格：
- 主申请人护照、身份证、户口本、婚姻证明
- 无犯罪记录证明（近12个月内）
- 收入证明、完税证明（近5年）
- 企业营业执照、审计报表、股权架构图
- 投资资金来源说明及资金路径图
- EB-5额外要求：USCIS认可的合法资金来源文件包（Source of Funds Report）

### 3.4 E-2第三国护照合规

| 方案 | 成本 | 时间 | 说明 |
|---|---|---|---|
| 格林纳达CBI | 约$150,000 | 3-4月 | E-2资格+格林纳达护照免签140+国，美国E-2有效期5年 |
| 土耳其CBI | 约$400,000（购房） | 3-6月 | E-2资格+土耳其护照，美国E-2有效期3个月（入境给2年） |
| 葡萄牙黄金签证→公民 | 约€500,000+ | 5-6年 | 先获黄金签证→5年后可申请公民→E-2资格，周期极长 |

> ⚠️ 注意：仅持有第三国护照不足以满足E-2申请条件。使领馆会审查申请人与条约国的真实联系（如在该国居住时间、经济活动、社会关系等）。格林纳达CBI因与美国的E-2互惠关系较成熟，是实际操作中较常见的E-2"跳板"方案。

## 五、投资使用建议

### 5.1 EB-5投资选择框架

| 项目类型 | 投资额 | 排期 | 风险 | 适合人群 |
|---|---|---|---|---|
| 乡村TEA项目 | $800,000 | 当前无排期(Current) | 中等（项目较新） | 优先推荐 |
| 高失业区TEA项目 | $800,000 | 当前无排期(Current) | 中低（成熟项目多） | 推荐 |
| 基建项目 | $800,000 | 当前无排期(Current) | 取决于具体项目 | 视项目 |
| 非TEA项目 | $1,050,000 | 中国约2015-2016年 | 中低 | 不推荐（排期太长） |
| 直投EB-5（非区域中心） | $800,000/$1,050,000 | 视类别 | 较高（须自创10就业） | 适合有真实经营计划者 |

### 5.2 推荐EB-5投资组合策略

| 原则 | 说明 |
|---|---|
| 选择预留签证项目 | 乡村/高失业区/基建项目当前无排期，中国申请人可双递交获工卡+回美证 |
| 审查区域中心资质 | 区域中心须在USCIS注册且无不良记录，查阅I-924/I-956批文 |
| 就业创造冗余 | 项目就业模型须有充足缓冲（建议>20%冗余），确保I-829阶段10个就业仍满足 |
| 资金结构安全 | EB-5资金在项目资本结构中占比不宜过高（建议30%以内），有开发商投入撬动 |
| 退出策略明确 | 贷款模式（5-7年还款）优于股权模式；优先股/第一顺位还款更安全 |
| 尽职调查不可省 | 项目方背景、开发商过往项目记录、经济学报告（就业模型）、第三方审计 |
| I-956F获批优先 | 项目I-956F已获批可大幅降低I-526E被RFE风险 |
| 不all-in单一项目 | 如有条件，可考虑分散至1-2个不同类型项目 |

### 5.3 投资管理重点

| 原则 | 说明 |
|---|---|
| 维持投资 | EB-5投资须"at risk"并维持至I-829获批（约2-5年） |
| 就业创造 | 须证明投资直接/间接创造了至少10个全职就业机会 |
| 资金来源保持 | USCIS可在I-829阶段重新审查资金来源合规性 |
| 不可赎回 | 投资期间不得有任何形式的保本或赎回承诺（违反"at risk"要求） |
| 不得质押 | 投资资产不得用于抵押贷款 |
| 合规报告 | I-829提交时需附上更新的就业创造证明+投资维持证明 |

### 5.4 不建议做法

- 不建议选择非预留签证类别的EB-5项目（中国排期5-7年）
- 不建议将全部资金投入新建/无过往记录的区域中心项目
- 不建议选择就业模型仅刚好达到10个就业、无任何缓冲的项目
- 不建议购买任何形式的"保本保息"EB-5产品（违反USCIS"at risk"原则）
- 不建议用EB-5资金购买美国住宅房产（不符合EB-5就业创造要求）
- 不建议只听项目方或中介单方推荐，应由独立移民律师+投资顾问+会计师三方交叉验证
- 不建议忽视USCIS对资金来源的补件风险（RFE/NOID），需预留证据准备时间

## 六、财富架构搭建方案

### 6.1 推荐架构：美国为财富管理中心+离岸保护层

![美国财富架构](flow-财富架构.svg)

### 6.2 美国财富管理架构要点

| 架构层级 | 工具/实体 | 用途 | 税务考量 |
|---|---|---|---|
| 美元投资层 | 美国经纪账户/退休账户(IRA) | 美股/ETF/债券/REITs | 资本利得税（长期0-20%）；股息税（合格股息0-20%） |
| 房产持有层 | LLC持有投资房产 | 资产保护+税务穿透 | 折旧抵扣+1031交换+非美人士FIRPTA |
| 家族传承层 | 不可撤销信托(Irrevocable Trust) | 遗产税规避（美国人免税额$1361万/2025年） | 非美居民遗产税免税额仅$6万！ |
| 离岸保护层 | 开曼/BVI/香港离岸架构 | 资产隔离+跨境税务规划 | 注意PFIC/CRE/CFC申报 |
| 事业运营层 | C-Corp/S-Corp/LLC | 在美业务运营 | 公司税率21%（C-Corp）；穿透税制（S-Corp/LLC） |

### 6.3 ⚠️ 非美国居民遗产税风险（关键提醒）

| 身份 | 遗产税免税额 | 超出部分税率 |
|---|---|---|
| 美国公民/绿卡持有者 | $1,361万（2025年，每人） | 18%-40%累进 |
| 非美国居民（中国籍无绿卡） | 仅**$6万** | 26%-40%累进 |

> ⚠️ 这意味着：如中国籍客户在美国购买房产或持有在美资产（股票、基金等），在获得绿卡之前一旦身故，在美资产超过$6万的部分将面临26%-40%的遗产税！解决方案：①通过离岸公司/BVI/开曼架构持有美国资产；②购买美国寿险（ILIT不可撤销人寿保险信托）；③尽快完成绿卡流程获得美国居民遗产税免税额。

### 6.4 跨境架构建议

| 场景 | 架构建议 | 税务/合规考量 |
|---|---|---|
| 中国→美国投资 | 开曼/BVI→美国LLC→在美项目/房产 | 避免直接以中国个人名义持有美国资产（防遗产税） |
| 美国业务运营 | 美国C-Corp或LLC | 按业务规模和税务需求选择 |
| 跨境服务贸易 | 香港公司→服务合同→美国客户 | 避免美国PE（常设机构）+转移定价合规 |
| 返程投资中国 | 美国LLC→香港→WFOE→中国运营 | 外商投资负面清单审查 |
| 知识产权持有 | 离岸IP公司→授权→美国运营公司 | IP放在低税地+特许权使用费 |

### 6.5 不建议架构

- 不建议中国个人直接持有大量美国境内资产（遗产税仅$6万免税额）
- 不建议为避税虚构关联交易或转移定价
- 不建议忽视CRS和FATCA申报义务
- 不建议架构过于复杂导致合规成本高于税务节省
- 不建议用不可撤销信托持有唯一住房等核心资产（失去控制权）

## 七、税务分析

### 7.1 美国税制核心

| 税种 | 税率 | 说明 |
|---|---|---|
| 联邦个人所得税 | 10%-37%（七级累进） | 全球征税（基于税务居民身份） |
| 州个人所得税 | 0%-13.3%（各州不同） | 德州/佛州/华州等9州无州个税 |
| 资本利得税 | 短期（<1年）=普通所得税率；长期=0%/15%/20% | 另加3.8% NIIT（净投资收入税） |
| 公司所得税 | 21%（联邦） | 另加州税（0%-11.5%） |
| 赠与税/遗产税 | 18%-40% | 2025年终身免税额$1,361万/人（美国人）；非美居民$6万 |
| 房产税(Property Tax) | 约1%-2.5%/年 | 按评估值征收，各州/郡不同 |
| 销售税(Sales Tax) | 0%-10.25% | 各州不同；俄勒冈/蒙大拿等5州无销售税 |
| 社会保障税(FICA) | 雇员7.65%（工资税） | 雇主匹配同等金额 |
| 替代最低税(AMT) | 26%/28% | 高收入者的并行税制 |
| FATCA | 申报义务 | 海外金融资产>$5万须报告（Form 8938） |

### 7.2 税务居民判断

| 情形 | 税务身份判断 | 影响 |
|---|---|---|
| 持绿卡（Lawful Permanent Resident） | 自动成为美国税务居民 | 全球收入须申报（有外国税收抵免Foreign Tax Credit） |
| 在美实际居住≥183天/年（substantial presence test） | 构成美国税务居民 | 无论持何种签证 |
| 持绿卡但长期不在美居住 | 仍为美国税务居民（除非正式放弃绿卡） | 全球征税持续 |
| 放弃绿卡+满足expatriation条件 | 可能触发弃籍税（Exit Tax） | 净资产>$200万或近5年平均税负>$17.8万须缴纳 |
| 中国+美国双重税务居民 | 中美税收协定可打破僵局 | 以永久住所→重要利益中心→习惯性居所→国籍排序 |
| 仅在美国有资产但非税务居民 | 仅美国来源收入纳税（FDAP/ECI） | 非美居民在美资产遗产税免税额仅$6万 |

### 7.3 美国税制核心优势与挑战

| 优势 | 说明 |
|---|---|
| 外国税收抵免(FTC) | 境外已纳税款可抵免美国税负，避免双重征税 |
| 海外收入豁免(FEIE) | 2025年约$13万海外劳动收入可豁免（须满足Bona Fide Resident或Physical Presence测试） |
| 长期资本利得低税率 | 合格股息+长期资本利得最高23.8%（含NIIT），远低于普通收入37% |
| 退休账户延税 | 401(k)/IRA等退休账户投资可递延纳税 |
| 按揭利息抵扣 | 房贷利息（$75万以内贷款）可在itemized deduction中抵扣 |
| 子女税收抵免(CTC) | 每名子女$2,000/年（收入限制内） |

| 挑战 | 说明 |
|---|---|
| 全球征税 | 绿卡/USC的全球收入均须申报，合规成本高 |
| PFIC规则 | 非美国共同基金/ETF可能被认定为Passive Foreign Investment Company，征罚性税率 |
| FBAR/FATCA | 海外账户>$1万须申报FBAR；海外资产>$5万（在美居住者）须报FATCA |
| GILTI | 美国股东持有受控外国企业(CFC)的无形资产收入可能被当期征税 |
| 非美居民遗产税 | 仅$6万免税额，远低于美国居民的$1,361万 |
| 弃籍税(Exit Tax) | 长期绿卡持有者放弃绿卡可能触发 |

### 7.4 税务风险边界

- 取得绿卡=自动成为美国税务居民，全球征税——此不可逆
- 中国收入（工资/分红/租金/资产出售）须在美国申报，可用FTC抵免
- 中国房产出售增值在美国也须申报资本利得
- 持有中国公司股权可能涉及GILTI/CRE/5471申报
- CRS信息交换：美国不参与CRS，但FATCA双边互换
- 中国与新GR（新全球税收规则）与中国金税四期的潜在影响
- FBAR（FinCEN Form 114）：海外金融账户>$10,000必须申报（刑事处罚风险）
- 退出策略：如需放弃绿卡，在持有绿卡<8年（部分情况<7年）可避免弃籍税

## 八、资金跨境合规方案

### 8.1 EB-5资金出境推荐路径

| 阶段 | 动作 | 周期 | 交付物 |
|---|---|---|---|
| 1 | 客户资产全面体检：银行存款、股票、房产、企业股权、信托 | 1-2周 | 资产清单+来源路径图 |
| 2 | 确认出境方式：ODI/境外分红/出售境外资产/合规换汇 | 2-4周 | 资金出境方案确认书 |
| 3 | ODI路径：发改委备案+商务部核准+外汇登记 | 4-8周 | ODI全套批文 |
| 4 | 境外存量：提供历史资金来源证明+原始入账记录 | 1-2周 | 资金来源说明书 |
| 5 | 资金转入美国EB-5托管账户（Escrow） | 1-2周 | SWIFT汇款记录+银行确认 |
| 6 | USCIS资金来源报告（Source of Funds Report） | 2-4周 | 完整SOF报告（移民会计师签署） |
| 7 | 提交I-526E申请 | 1周 | 受理回执(I-797C) |
| 8 | I-526E+I-485双递交（如在美） | 同步 | I-765+I-131回执 |

### 8.2 ODI路径详解

| 步骤 | 部门 | 文件 | 周期 |
|---|---|---|---|
| 1.发改委备案/核准 | 国家/省发改委 | 境外投资项目备案表/申请书 | 7-20工作日 |
| 2.商务部备案/核准 | 商务部/省商务厅 | 境外投资备案表/申请表 | 3-7工作日 |
| 3.外汇登记 | 银行/外管局 | ODI外汇登记 | 1-2周 |
| 4.资金汇出 | 银行 | 外汇汇出申请 | 1-5工作日 |
| 合计 | | | 约1-3个月 |

ODI适合金额大（$80万+级别）、合规性要求最高的EB-5路径。但ODI要求境外投资有真实项目，做EB-5投资能否通过ODI审批需个案判断——建议以"在美国设立境外投资平台+投资美国商业项目"为名义申报。

### 8.2.1 个人境外投资合规——37号文登记

37号文全称《国家外汇管理局关于境内居民通过特殊目的公司境外投融资及返程投资外汇管理有关问题的通知》（汇发〔2014〕37号），是境内居民个人境外投资最重要的合规路径之一。

**适用对象：**
- 境内居民个人以境外特殊目的公司(SPV)进行境外投融资及返程投资
- 常见场景：个人在境外设立BVI/开曼/香港公司接收境内资产

**核心要求：**
- 需在设立/控制SPV后、向SPV出资前办理外汇登记
- 登记机关：国家外汇管理局（通过银行办理）
- 须提供：SPV注册文件、境内居民身份证明、境外融资商业计划书等

**未办理37号文登记的后果：**
- 无法合规将境内资产注入境外SPV
- 返程投资（WFOE/FDI）时外汇无法合规入境
- 可能被认定为逃汇，面临行政处罚甚至刑事责任
- 境外上市时构成重大合规障碍
- USCIS审查EB-5资金来源时可能要求解释资金出境合规性

**操作要点：**
- 37号文登记须在"出资前"完成（先登记后出资），不可事后补办
- 登记须在SPV设立/控制后尽快办理（建议在SPV设立后30日内启动）
- 实际办理周期：通常1-3个月（取决于当地外管局和银行审核速度）
- 建议在资金出境方案设计阶段同步评估37号文适用性
- 如需跨境架构，应在签约前由律师确认37号文可行性

### 8.3 严禁路径

- 地下钱庄/找换店大额换汇（USCIS与FinCEN有信息共享机制）
- 虚假贸易/虚开发票
- 现金搬运出入境
- 第三方代付且无法解释最终受益人
- 多人拆分5万美元购汇后归集至同一美国账户
- 虚拟货币换汇（政策灰色地带，USCIS审查风险极大）

## 九、身份路径规划

### 9.1 美国移民路径全景

| 路径 | 签证类型 | 首次获批 | 续签/转正 | 直接绿卡 | 配偶工作 | 入籍时间 |
|---|---|---|---|---|---|---|
| EB-5 | 移民 | 2年条件绿卡 | I-829→10年永久绿卡 | ✅ | ✅ | 条件绿卡起5年 |
| EB-1A | 移民 | 10年永久绿卡 | 到期续卡 | ✅ | ✅ | 获批起5年 |
| EB-2 NIW | 移民 | 10年永久绿卡 | 到期续卡 | ✅ | ✅ | 获批起5年 |
| L-1A | 非移民(双意图) | 1-3年 | 可续至最多7年 | 转EB-1C | L-2 EAD可工作 | 转绿卡后5年 |
| E-2 | 非移民 | 2-5年(视条约) | 无限续签 | ❌ | E-2配偶可工作 | 需先转绿卡 |
| O-1A | 非移民 | ≤3年 | 1年一续 | ❌ | ❌(O-3不可工作) | 需先转绿卡 |

### 9.2 EB-5投资移民——深度解析

| 维度 | 内容 |
|---|---|
| **法律依据** | 2022年《EB-5改革与诚信法案》(RIA)，2022年5月13日生效；USCIS Policy Manual Vol.6 Part G |
| **投资金额** | TEA（目标就业区/基建）：**$800,000**（约¥584万）；非TEA：**$1,050,000**（约¥767万） |
| **申请方式** | 通过USCIS指定的区域中心(Regional Center)或自投(NCE直投) |
| **就业创造** | 须直接/间接创造至少10个全职美国工作岗位 |
| **申请流程** | I-526E(投资移民申请) → 获批→ 条件绿卡(2年) → I-829(转正申请) → 10年永久绿卡 |
| **双递交(Concurrent Filing)** | 在美持有合法身份者可同时递交I-526E+I-485(调整身份)+I-765(工卡)+I-131(回美证) |
| **排期(2026.6)** | 预留签证类(乡村/高失业区/基建)全部Current无排期；非预留类中国约2015-2016年 |
| **子女人数限制** | 21岁以下未婚子女可随行（以I-526/I-526E批准时或排期到达时的CSPA年龄为准） |
| **转永久绿卡** | I-829获批后获10年永久绿卡；第5年可申请入籍 |
| **入籍条件** | 自初始条件绿卡获批起第5年可申请入籍（无论I-829是否已批准）；5年内至少30个月在美实际居住 |
| **投资退出** | 投资退出时间取决于项目协议，通常在I-829获批后；部分项目可更早但须确保已满足就业创造+投资维持要求 |
| **优点** | 无学历/语言/年龄/工作经验要求；预留类当前无排期；双递交3-6个月获工卡+回美证 |
| **缺点** | 投资金额大、资金锁定期2-5年、项目风险、资金来源审查严格 |

### 9.3 EB-1A杰出人才——深度解析

| 维度 | 内容 |
|---|---|
| **法律依据** | INA §203(b)(1)(A)；USCIS Policy Manual Vol.6 Part F |
| **适用人群** | 科学、艺术、教育、商业或体育领域具有"extraordinary ability"的申请人 |
| **核心优势** | 无需雇主担保、无需劳工证(PERM)、可自行申请、一步到位10年绿卡 |
| **标准** | 满足10项中至少3项（或一次性重大成就如诺贝尔奖/奥斯卡奖/奥运奖牌） |
| **10项标准** | ①全国/国际奖项 ②专业协会会员 ③媒体报道 ④担任评审 ⑤原创性贡献 ⑥学术/行业文章 ⑦作品展览/展示 ⑧领导/关键角色 ⑨高薪/高报酬 ⑩商业成功 |
| **审批方式** | I-140提交→可用Premium Processing加急($2,805,15天出结果) |
| **排期(2026.6)** | 中国Final Action Date：**2023年4月1日**（约3年排期） |
| **全程时间** | I-140(加急15天) → 等待排期(约2-3年) → I-485(6-12月) → 绿卡；全程约3-4年 |
| **随行亲属** | 配偶+21岁以下未婚子女 |
| **配偶工作** | 获批后配偶可自由工作 |
| **优点** | 无需雇主/劳工证、可加急、一步到位绿卡、自由度高 |
| **缺点** | 证据门槛高（须证明"top of the field"）、中国排期约3年、不适合普通背景申请人 |

### 9.4 EB-2 NIW国家利益豁免——深度解析

| 维度 | 内容 |
|---|---|
| **法律依据** | INA §203(b)(2)(B)(i)；Matter of Dhanasar, 26 I&N Dec. 884 (AAO 2016) |
| **适用人群** | 高学历（硕士以上）或具备"exceptional ability"的专业人士，从事国家利益相关事业 |
| **核心优势** | 无需雇主担保、无需劳工证(PERM)、可自行申请 |
| **Dhanasar三要素** | ①申请人拟从事的事业具有实质性价值和国家重要性(Substantial Merit & National Importance) ②申请人有能力推进该事业(Well-positioned to advance) ③综合考虑后，免除劳工证对美国有利(On balance, waiving the job offer requirement would benefit the US) |
| **学历要求** | 硕士以上学位（或本科学位+5年以上渐进式工作经验） |
| **审理方式** | I-140提交→可用Premium Processing(加急45天出结果，非15天) |
| **排期(2026.6)** | 中国Final Action Date有排期（约2-4年） |
| **2025年政策收紧** | USCIS 2025年1月更新NIW政策指南：更严格审查"职业资格"与"事业"匹配度；加强"国家重要性"论证要求 |
| **随行亲属** | 配偶+21岁以下未婚子女 |
| **优点** | 无需雇主、适合STEM/研究人员、比EB-1A门槛低 |
| **缺点** | 排期比EB-1A更长、2025年政策收紧、需要强有力的三要素论证 |

### 9.5 L-1A/EB-1C跨国高管——深度解析

| 维度 | L-1A（非移民） | EB-1C（移民·绿卡） |
|---|---|---|
| **适用条件** | 申请人过去3年内至少1年在海外关联公司担任高管/经理；调任至美国关联公司任同等职位 | 海外公司与美国公司存在qualifying relationship（母公司/子公司/关联公司）；美国公司已持续运营≥1年 |
| **公司关系** | 海外公司+美国公司须为同一集团的母子公司/关联公司/分公司 | 同L-1A，标准更严（如新设办公室L-1A需运营满1年后方可申请EB-1C） |
| **签证/绿卡** | 非移民工作签证 | 移民绿卡 |
| **有效期** | 首次1-3年（新设办公室1年）；可续至最多7年 | 永久绿卡 |
| **审批速度** | 1-3个月（可用加急15天） | 6-12个月 |
| **排期** | 无排期（非移民） | 中国EB-1C排期约3年（Priority Date约2023年4月） |
| **配偶工作** | L-2配偶可申请EAD工卡工作 | 绿卡配偶自由工作 |
| **子女** | 免费入读K-12公立学校 | 同左+州内大学学费资格 |
| **优点** | 中国企业主赴美最佳桥接；绕过EB-5排期；配偶可工作；子女免费公立教育 |
| **缺点** | 须中美公司关联性真实、高管职位真实；新设办公室L-1A需运营满1年方转EB-1C；USCIS对L-1审查趋严 |

### 9.6 E-2条约国投资者——深度解析

| 维度 | 内容 |
|---|---|
| **签证性质** | 非移民投资签证 |
| **条约国要求** | 申请人须为E-2条约国公民（80+国家，含加拿大/英国/日本/韩国/土耳其/格林纳达；**中国大陆不在其中**） |
| **投资要求** | 对美国企业进行"实质性投资"(substantial investment)；无固定最低金额，通常建议≥$100,000 |
| **持股要求** | ≥50%股权并积极参与经营管理（或担任管理/执行级职位） |
| **企业类型** | 须为"真实且运营中的企业"(real and operating enterprise)；不能仅是闲置资产或被动投资 |
| **有效期** | 通常签发2-5年（取决于对等协议）；每次入境通常给2年停留期 |
| **续签** | 可无限次续签，只要企业持续运营并符合条件 |
| **配偶工作** | E-2配偶可申请EAD工卡自由工作 |
| **子女** | 可免费入读K-12公立学校（但大学不享受州内学费） |
| **能否转绿卡** | E-2本身不能直接转绿卡，但可通过EB-5/EB-1C/EB-2/亲属移民转换；E-2非"双重意图"签证 |
| **中国籍前提** | 须先取得E-2条约国护照（如格林纳达CBI $15万/土耳其CBI $40万购房），耗时3-6月 |
| **优点** | 中等投资门槛、审批快、无限续签、配偶可工作、无需学历/语言 |
| **缺点** | 非移民签证不能转绿卡、需先获第三国护照、投资非保本 |

### 9.7 O-1A杰出能力非移民——深度解析

| 维度 | 内容 |
|---|---|
| **适用人群** | 科学、教育、商业、体育领域具备extraordinary ability的申请人 |
| **签证性质** | 非移民工作签证，可作为EB-1A/NIW的"前哨" |
| **证据标准** | 满足8项中至少3项：奖项、会员、媒体报道、评审、原创贡献、学术文章、关键职位、高薪；或一次性重大国际奖项 |
| **雇主要求** | 必须有美国雇主/美国代理人/项目合同提交I-129；不可纯自雇无项目 |
| **有效期** | 首次最长3年；后续按项目需要1年一续；可无限续签 |
| **审批速度** | Premium Processing加急($2,805)，15天出结果 |
| **与EB-1A证据共用** | O-1A证据材料与EB-1A高度重合（奖项、媒体、评审、贡献等），O-1A获批可成为EB-1A的强力支撑 |
| **配偶** | O-3签证随行（不可工作，可学习） |
| **优点** | 无年度抽签、无固定工资门槛、可快速登陆美国、对后续EB-1A/NIW有铺垫价值 |
| **缺点** | 非绿卡、与雇主/项目绑定、须有真实美国工作/项目机会 |

### 9.8 EB-1A+NIW+O-1A组合策略

| 客户类型 | 推荐组合 | 逻辑 |
|---|---|---|
| 已满足EB-1A 3项以上且有美国项目 | **O-1A快速登陆 + EB-1A同步递交** | O-1解决赴美工作/项目身份(15天)，EB-1A解决绿卡(排期约3年) |
| 硕博/STEM/专业人士，EB-1A不足3项 | **O-1A + NIW** | O-1A先以项目/雇主身份赴美，NIW走国家利益绿卡 |
| 企业家/高管/产品负责人 | **O-1A商业杰出能力 + NIW/EB-1A双轨** | 商业成就、媒体、融资、专利、行业影响可同时服务O-1A和EB-1A/NIW |
| 有中美公司+高管履历 | **L-1A先赴美 + EB-1C绿卡** | L-1A快速登陆+运营1年后转EB-1C，配偶L-2可工作 |

### 10.5 CSPA子女年龄保护详解

《儿童身份保护法》(Child Status Protection Act)允许在排期等待期间"冻结"子女年龄：

- **计算方式**：CSPA年龄 = 排期到达时的实际年龄 - I-526/I-140审理时间（天）
- **Sought to Acquire**：排期到达后须在**1年内**完成I-485/DS-260申请
- **EB-5双递交优势**：在美国境内双递交I-526E+I-485可立即"锁定"子女年龄，永久保护
- **⚠️ 关键**：如子女接近21岁，优先选择无排期路径（EB-5预留类）并在美双递交，最大程度保护子女年龄

### 11.3 绿卡维持（关键）

|---|---|

| 家庭成员在美 | 配偶+子女在美常住=最强居住证据 |

**推荐策略：**
- 策略一（最强）：全家在美常住，子女入读美国学校，主申在美国工作/经营/管理投资。
- 策略二（次强）：配偶+子女在美常住+读书，主申中美往返（每次不超过6个月）。
- 策略三（需回美证）：主申因事业需要频繁往返，申请回美证（I-131），获最长2年境外停留许可。
- 策略四（风险——不推荐）：全家均不在美常住，仅偶尔入境——CBP可能认定放弃居住意图，拒绝入境。

## 十四、重要风险声明

### 14.1 居留与绿卡维持风险

**美国绿卡（永久居民身份）不等同于美国公民身份。绿卡持有者须证明在美实际居住意图，每次离境不超过6个月（超过须申请回美证I-131）。离境超过1年（或回美证过期）可能被认定为放弃绿卡（abandonment of LPR status）。CBP官员有权在入境时审查绿卡持有者的居住意图。即使持有有效绿卡，如在境外长期居住，CBP可要求签署I-407自愿放弃绿卡或发起驱逐程序。**

### 14.2 EB-5投资风险

**EB-5投资是"at risk"投资，USCIS严禁任何形式的保本或赎回承诺。投资本金可能面临商业亏损、项目失败、区域中心违规等风险。就业创造不达标可能导致I-829被拒。区域中心管理团队的不当行为可能影响所有投资人。USCIS不担保任何投资回报或本金安全。投资者须独立评估项目风险，做好投资损失的心理和财务准备。**

### 14.3 排期风险

**EB-1A/EB-2 NIW/EB-5非预留类中国申请人面临排期，排期时间可能随政策变化而波动。签证公告(Visa Bulletin)每月更新，Final Action Date可能前进、停滞甚至倒退(retrogression)。排期期间子女可能超龄（超过21岁），须精确计算CSPA年龄保护。EB-5预留类当前无排期(Current)，但随申请量增长未来可能出现排期。**

### 14.4 资金来源审查风险

**USCIS对EB-5资金来源采用"优势证据"(preponderance of evidence)标准，要求追溯至原始合法来源。资金来源文件不充分或存在矛盾可能导致I-526E被RFE(补件通知)、NOID(拒签意向)或直接拒签。即使I-526E通过，USCIS在I-829阶段仍可重新审查资金来源。中国的外汇管制与USCIS的资金来源审查之间存在天然张力——客户须走合规资金出境渠道。**

### 14.5 税务风险

**取得美国绿卡=自动成为美国税务居民，全球收入须向IRS申报（可使用外国税收抵免FTC避免双重征税）。FBAR(海外账户>$1万须申报)和FATCA(海外资产>$5万须报告)的申报义务伴随民事和刑事处罚风险。放弃绿卡可能触发弃籍税(Exit Tax)——如净资产>$200万或近5年平均税负>$17.8万。持有时间<8年的绿卡持有者通常可避免弃籍税。**

### 14.6 子女教育风险

**子女须在获批绿卡时未满21岁（CSPA保护下可部分冻结年龄）。排期过长可能导致子女超龄失去随行资格。州内大学学费资格通常要求在所在州居住满1年+证明该州为primary domicile。医学院/法学院等专业学位对非公民的录取和资助有限制。**

### 14.7 L-1A/EB-1C风险

**USCIS对L-1A新设办公室(New Office)审查极其严格，须证明：①已获得实体办公室 ②有充足的运营资金 ③有明确的商业计划。L-1A新设办公室首次仅获批1年，届满前须提交续签证明公司已实质性运营。EB-1C要求海外关联公司在美国公司成立前已持续运营≥1年。USCIS近年对"managerial/executive capacity"的审查标准越来越高。**

### 14.8 E-2路径风险

**E-2非移民签证不能直接转绿卡——后续须通过EB-5/EB-1C/EB-2/亲属移民转换。E-2投资者子女在大学阶段不能享受州内学费（因父母非绿卡持有者）。第三国护照（如格林纳达CBI）的政治和外交风险：如格林纳达与美国互惠协议变更或CBI项目关停，E-2资格可能受影响。使领馆会审查申请人与条约国的真实联系。**

### C. 法律适用注意事项

1. **EB-5"at risk"原则不能违背**：任何保本承诺、回购协议、收益保证均违反USCIS规定，可能导致I-526E/I-829被拒。投资须真实承担商业风险。
2. **资金来源审查贯穿全流程**：USCIS在I-526E和I-829阶段均可审查资金来源，建议将所有原始证据至少保存至I-829获批后3年。
3. **双递交在美合法身份要求**：I-526E+I-485双递交的前提是在美国境内持有合法非移民身份（如B-2/F-1/H-1B/L-1等），且在排期Current时身份有效。无合法在美身份者只能在海外领馆走领事处理(Consular Processing)。
4. **绿卡居住意图(living intent)是持续性要求**：每次入境CBP均可审查，长期离境可能被认定为abandonment。建议保留完整的在美生活证据链。
5. **CSPA年龄计算精确到天**：子女须在I-526/I-140获批后、排期到达后1年内完成I-485/DS-260申请，否则失去CSPA保护。
6. **税务建议须独立判断**：本方案税务分析为初步框架，不构成正式税务建议。客户落地前须由美国注册会计师(CPA)或税务律师独立评估。
7. **所有费用以签约方合同为准**：本方案预算为参考口径，实际费用以律师/顾问合同、USCIS官网最新收费标准、银行账单为准。

  },200);

}
