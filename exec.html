function crc32(str){var table=window._crcTable;if(!table){table=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=((c&1)?(0xedb88320^(c>>>1)):(c>>>1));table[n]=c>>>0;}window._crcTable=table;}var crc=0^(-1);for(var i=0;i<str.length;i++){crc=(crc>>>8)^table[(crc^str.charCodeAt(i))&0xff];}return (crc^(-1))>>>0;}
function u16(n){return String.fromCharCode(n&255,(n>>>8)&255)}function u32(n){return String.fromCharCode(n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255)}
function makeZipBlob(filename,content){var data=unescape(encodeURIComponent(content));var name=unescape(encodeURIComponent(filename));var crc=crc32(data);var local='PK\x03\x04'+u16(20)+u16(0)+u16(0)+u16(0)+u16(0)+u32(crc)+u32(data.length)+u32(data.length)+u16(name.length)+u16(0)+name+data;var central='PK\x01\x02'+u16(20)+u16(20)+u16(0)+u16(0)+u16(0)+u16(0)+u32(crc)+u32(data.length)+u32(data.length)+u16(name.length)+u16(0)+u16(0)+u16(0)+u16(0)+u32(0)+u32(0)+name;var end='PK\x05\x06'+u16(0)+u16(0)+u16(1)+u16(1)+u32(central.length)+u32(local.length)+u16(0);var zip=local+central+end;var bytes=new Uint8Array(zip.length);for(var i=0;i<zip.length;i++)bytes[i]=zip.charCodeAt(i)&255;return new Blob([bytes],{type:'application/zip'});}

function mdToHtml(md){var lines=String(md||'').replace(/\r\n/g,'\n').split('\n'),html='',inList=false,inTable=false,table=[];function closeList(){if(inList){html+='</ul>';inList=false}}function closeTable(){if(!inTable)return;html+='<div class="table-wrap"><table>';for(var i=0;i<table.length;i++){var cells=table[i].split('|').slice(1,-1).map(function(c){return c.trim()});if(i===1&&cells.every(function(c){return /^:?-{3,}:?$/.test(c)}))continue;html+='<tr>'+(i===0?cells.map(function(c){return '<th>'+inlineMd(c)+'</th>'}).join(''):cells.map(function(c){return '<td>'+inlineMd(c)+'</td>'}).join(''))+'</tr>'}html+='</table></div>';inTable=false;table=[]}for(var i=0;i<lines.length;i++){var line=lines[i].trimEnd();if(!line){closeList();closeTable();continue}if(/^```/.test(line)){continue}if(/^\|.*\|$/.test(line)){closeList();inTable=true;table.push(line);continue}closeTable();if(/^#{1,6}\s+/.test(line)){closeList();var lv=line.match(/^#{1,6}/)[0].length;html+='<h'+lv+'>'+inlineMd(line.replace(/^#{1,6}\s+/,''))+'</h'+lv+'>';continue}if(/^[-*]\s+/.test(line)){if(!inList){html+='<ul>';inList=true}html+='<li>'+inlineMd(line.replace(/^[-*]\s+/,''))+'</li>';continue}closeList();html+='<p>'+inlineMd(line)+'</p>'}closeList();closeTable();return html}

function buildPlan(){
 var issue=q('issue')||'未关联';var solution=q('solution')||'A';var project=q('project')||'us-eb5';var projectName=projectMap[project]||project;

 var md=`# 美国EB-5投资移民执行策划案\n\n> 生成日期：2026-06-08  \n> 适用对象：拟通过美国EB-5投资移民（目标就业区）取得美国永久居民身份的高净值家庭/企业主  \n> 文档版本：客户交付版 V1.0  \n> 重要声明：本策划案为商业规划与执行框架，不构成法律、税务、投资或移民建议；落地前须由美国持牌移民律师、税务师、区域中心/项目方进行最终确认。\n\n---\n\n## 摘要结论\n\n本方案建议客户以"美国EB-5投资移民（目标就业区TEA）"为主路径：通过向TEA区域中心项目投资不少于80万美元（约576万人民币），满足创造至少10个全职美国就业岗位的要求后，申请人及其配偶、21岁以下未婚子女可获得美国有条件永久居留权（2年），条件期满后可申请I-829转无条件永久居留（10年绿卡），最终在第5年可申请美国公民身份。\n\n本方案的执行重点有三项：第一，EB-5项目选择必须经过严格的尽职调查——区域中心资质、项目商业计划、就业创造模型、资金结构和退出机制缺一不可；第二，客户800,000美元资金来源必须可解释、可追踪、可留痕，须满足USCIS对合法资金来源的严格审查要求（包括纳税记录、企业利润、房产出售、赠与/继承等）；第三，绿卡持有后须严格管理税务居民身份——美国对绿卡持有者和符合实质居住测试者征收全球所得税，客户必须接受税务申报和合规义务，不能将EB-5简单理解为"买个身份"。\n\n## 一、客户家庭基本信息（待补充版）\n\n### 1.1 已知/默认信息\n\n| 项目 | 当前信息 | 状态 |\n|---|---|---|\n| 客户身份 | 中国籍家庭/企业主/高净值客户 | ⚠️ 待确认 |\n| 核心目标 | 取得美国永久居民身份（绿卡）、子女教育、全球资产配置 | ⚠️ 待确认 |\n| 预算范围 | 至少覆盖EB-5投资门槛：USD 800,000（TEA）+ 项目发行费约USD 80,000+律师费USD 25,000-30,000 | ✅ 已知政策门槛 |\n| 家庭成员 | 主申请人、配偶、21岁以下未婚子女可随行 | ⚠️ 待确认家庭结构 |\n| 是否放弃中国国籍 | 拿到绿卡不等于放弃中国国籍；入籍后才涉及中国国籍法冲突 | ⚠️ 需强制风险提示 |\n| 是否计划在美国居住 | EB-5绿卡持有者须证明"有在美国定居的意图"，不建议"绿卡后不登陆、不居住"的躺平策略 | ⚠️ 待确认 |\n| 是否考虑E-2跳板 | 中国护照非E-2条约国；如先取得土耳其/格林纳达国籍再申请E-2，需评估3年住所要求和E-2→EB-5转换路径 | ⚠️ 待确认 |\n| 资金来源 | 80万美金+费用的来源须可解释：企业利润/分红/房产出售/股权转让/赠与/继承 | ❌ 待确认 |\n| 税务身份 | 中国税务居民为默认假设；拿到绿卡后将触发美国全球征税 | ⚠️ 待确认 |\n| 是否有敏感合规问题 | 地下钱庄、未申报境外资产、资金来源瑕疵等 | ❌ 待确认 |\n\n### 1.2 待解决问题分级\n\n| 编号 | 问题 | 严重度 | 说明 |\n|---|---|---|---|\n| Q1 | EB-5目标是否清晰：要"绿卡"还是要"功能性身份"？ | P1 | EB-5是目前美国投资移民最主流路径，但伴随全球税务义务；如仅需第二身份/E-2跳板，土耳其等CBI路径成本更低、税务更友好。 |\n| Q2 | 资金出境路径是否合法 | P0 | USD 800,000+费用出境必须合规；SEC要求资金来源路径清晰，严禁地下钱庄或虚假贸易。 |\n| Q3 | EB-5项目选择与尽职调查 | P0 | 项目是否真实运营、就业模型是否可行、退出机制是否合理，决定了绿卡安全性。 |\n| Q4 | 美国全球征税与税务合规 | P0 | 绿卡持有者和符合实质居住测试者须申报全球收入并纳税；客户需接受税务透明化。 |\n| Q5 | 排期与审理时长 | P1 | 非预留签证类别中国内地出生者目前有排期（约2015-2016年）；预留签证类别（乡村/高失业区）当前Current无排期。 |\n| Q6 | 家庭成员年龄 | P1 | 21岁以下未婚子女可随行；CSPA（儿童身份保护法）可延长年龄保护，但需律师核算具体适用；21岁以上子女不可随行。 |\n| Q7 | 实际居住意图 | P2 | EB-5批准后须证明有美国定居意图；长期不登陆可能影响I-829或入籍。 |\n\n### 1.3 根本判断\n\n**表面问题**：客户想办一张美国绿卡。  \n**真实问题**：客户可能是为子女教育、资产配置、全球流动性或"终极身份安全感"而选择美国路径，但必须接受美国全球征税、严格的资金来源审查和长期审理周期。如果客户只是想要一本功能性护照或低成本第二身份，应该认真对比EB-5与土耳其CBI、葡萄牙黄金签证等其他选项——EB-5的门槛和税务义务远高于被动型投资移民。\n\n---\n\n## 二、核心策略\n\n### 2.1 四象限定位\n\n| 维度 | 美国EB-5方案中的定位 | 判断 |\n|---|---|---|\n| 事业国 | 可能转为美国或仍为中国（取决于客户商业模式） | 若以企业家路径为主，L-1→EB-1C可能更适配 |\n| 居住国 | 拿到绿卡后建议有实质居住安排 | 不建议"绿卡后不登陆" |\n| 福利国 | 美国绿卡在教育、医疗、就业上福利显著，但代价是全球征税 | 需权衡福利与税负 |\n| 管钱地 | 绿卡后须考虑全球资产架构与税务合规 | 香港/新加坡信托+美国税务规划是常见组合 |\n| 功能性身份 | 美国绿卡+最终入籍是最强身份工具之一 | 核心价值明确但成本高 |\n\n### 2.2 推荐核心路线\n\n**推荐方案A：EB-5投资移民（TEA目标就业区，$800,000）→ 2年条件绿卡 → I-829转永久绿卡 → 第5年入籍。**\n\n理由：\n1. **门槛明确**：RIA法案（2022）设定TEA/基建项目$800,000、非TEA$1,050,000，该金额有效期至2027年9月30日。\n2. **预留签证无排期**：当前乡村项目、高失业区项目和基建项目预留签证类别"Current"无排期，可大幅缩短等待时间。\n3. **可携带家庭**：配偶和21岁以下未婚子女一同获得绿卡。\n4. **绿卡福利**：子女享受美国公立K-12免费教育和州内大学学费；5年后可申请美国公民。\n5. **投资可退出**：I-829批准后可按项目协议安排退出（具体退出机制取决于项目结构）。\n\n---\n\n## 三、合规清理详细方案\n\n### 3.1 资金来源合规\n\nEB-5投资移民对资金来源审查极为严格，这是整个方案中最大的单一风险点。\n\n| 环节 | 合规要求 | 风险点 | 执行动作 |\n|---|---|---|---|\n| 资金来源 | 须证明每一美元的合法来源 | 现金收入、不明代持、非法换汇 | 提供5年纳税记录、企业审计报表、分红决议、工资/股权变现文件 |\n| 资金路径 | 从源账户到EB-5项目托管账户的每一笔转账必须可追踪 | 多账户层级、中间账户、多人转账 | 银行对账单+SOP（资金来源说明函）+转账链证明 |\n| 资金出境 | 中国→境外账户须合规 | 地下钱庄、虚假贸易、拆分汇款 | 优先评估境外已有资产、企业ODI分红、银行合规换汇 |\n| 项目认购 | 须签署PPM（私募备忘录）、认购协议、运营协议 | 虚假项目、就业模型造假 | 由独立律师+经济学家审查就业创造报告和项目文件 |\n| Source of Funds (SOF) | 构建完整的资金来源档案 | 文件不完整、前后矛盾 | 律师协助编制SOF包：纳税记录→分红决议→银行流水→转账凭证 |\n\n### 3.1.1 企业KYB审查（当资金来源于企业时）\n\n资金来源合规不仅要看个人KYC，如果客户资金来自企业分红/股权转让/利润分配，还需对企业进行KYB（Know Your Business）审查：\n\n- 企业营业执照正副本\n- 近3年审计报告/财务报表\n- 企业股权架构图（穿透至最终受益人）\n- 近3年纳税记录/完税证明\n- 股东会/董事会决议（分红决议、股权转让决议）\n- 企业实际经营地、员工人数、主营业务说明\n- 关联交易说明（如有）\n- 无重大违法违规证明\n\n**注意：** USCIS对EB-5资金来源的审查会穿透看企业是否合法经营、是否足额纳税。如果资金来源是\"企业未分配利润分红\"，USCIS会审查该企业是否真实盈利、是否有足够的留存收益支撑分红金额。\n\n### 3.2 中国身份与税务边界\n\n- 领取绿卡后，中国国籍仍保留（绿卡不等于入籍），但拿绿卡满5年+居住要求后可申请入籍。\n- 入籍美国后根据《中国国籍法》第9条自动丧失中国国籍。\n- 绿卡期间：中国出入境继续使用中国护照；美国出入境使用绿卡。\n- 拿到绿卡即触发美国全球征税义务，不论是否在美国居住。\n\n### 3.3 反洗钱与银行审查\n\n美国银行、区域中心和USCIS都会严格审查资金来源。客户需提前准备：\n- 主申请人护照、身份证、户口本、婚姻证明。\n- 无犯罪记录。\n- 近5年个人所得税申报记录。\n- 企业营业执照、审计报告、股东名册、分红决议。\n- 房产出售合同/凭证（如资金来源包括房产变现）。\n- 赠与/继承文件（如资金来源为赠与/继承）。\n\n---\n\n## 四、境外资金归集与投资架构\n\n### 4.1 推荐资金路径\n\n| 路径 | 适用客户 | 优点 | 缺点 |\n|---|---|---|---|\n| 境外已有资产支付 | 已有香港/新加坡/美元资产 | 付款效率高，绕开中国外汇管制 | 需解释历史来源和境外税务合规 |\n| 境外公司分红 | 有境外运营公司 | 合规性强，可配合税务架构 | 需分红决议、审计、境外纳税记录 |\n| ODI（境外直接投资） | 有中国企业实体，可证明投资目的 | 合规性最高，资金出境有据可查 | 周期长（3-6个月），材料复杂 |\n| 房产/股权出售+合规换汇 | 有境内大额资产可出售 | 资金来源清晰 | 外汇管制下大额换汇困难 |\n| 家庭合规换汇 | 资金量不大、时间充裕 | 成本低 | 年度额度有限（每人每年5万美元），不适合800K+级别 |\n| 地下钱庄 | 不建议 | — | P0红区，直接导致I-526被拒或终身禁入 |\n\n### 4.2 资金预算框架\n\n| 项目 | 预算口径 | 说明 |\n|---|---:|---|\n| EB-5投资款 | ≥USD 800,000（TEA） | 向区域中心项目投资 |\n| 项目发行费/管理费 | USD 60,000-80,000 | 区域中心收取 |\n| 律师费 | USD 25,000-35,000 | 美国移民律师费 |\n| 资金来源文件费 | USD 3,000-8,000 | SOF编制、翻译、认证 |\n| USCIS申请费 | I-526E $6,155; I-829 $9,525; I-485 $1,440/人 | 官方申请费用 |\n| 体检费 | USD 200-500/人 | 移民体检（指定医生） |\n| 翻译公证认证 | RMB 10,000-20,000 | 中国文件翻译公证 |\n| 服务费 | ¥15-25万 | 按服务范围、路径复杂度、家庭人数确定 |\n\n---\n\n## 五、投资使用建议\n\n### 5.1 EB-5项目选择原则\n\n| 原则 | 说明 |\n|---|---|\n| 区域中心合规性 | 区域中心必须在USCIS批准名单上，且未涉及欺诈/违规记录。 |\n| 就业创造模型合理 | 须由独立经济学家出具就业创造报告；优先选择就业盈余充足的项目（就业创造超过10个/投资人，缓冲20-30%以上）。 |\n| 项目已开工或接近开工 | 降低"资金到位但项目未启动"的施工风险。 |\n| 还款/退出机制清晰 | 优选有银行高级贷款、开发商股权投资、独立托管账户和明确还款级的项目结构。 |\n| 项目类型适配 | 当前预留签证无排期类别：乡村项目（Rural）、高失业区项目（High Unemployment）、基建项目（Infrastructure）。 |\n| 不追求高回报 | EB-5首要目标是绿卡安全，不是投资收益最大化。 |\n\n### 5.2 典型EB-5项目结构\n\n| 维度 | 本方案口径 |\n|---|---|\n| 投资类型 | EB-5区域中心贷款模式（Loan Model） |\n| 投资金额 | USD 800,000（TEA项目） |\n| 发行费 | 约USD 70,000-80,000 |\n| 投资期限 | 通常5-7年（至I-829获批+还款） |\n| 年化收益 | 通常0.25%-1%（绿卡安全>投资收益） |\n| 退出方式 | 项目贷款还款后按比例返还投资人 |\n| 适合客户 | 追求美国绿卡、可接受5-7年投资锁定期、能接受全球税务义务的高净值家庭 |\n\n### 5.3 不建议做法\n\n- 不建议听单一销售口径而不做独立尽调。\n- 不建议选择就业模型脆弱、资金结构不清的项目。\n- 不建议用不合规资金路径完成EB-5投资。\n- 不建议忽视EB-5后持续的税务申报义务。\n- 不建议在I-526待批期间擅自改变资金来源说明。\n\n## 六、财富架构搭建方案\n\n美国绿卡后的财富架构须在绿卡获批前进行前瞻性规划。\n\n### 6.1 推荐架构\n\n\`\`\`text\n中国事业主体/家庭资产\n        ↓ 合规资金路径\n香港/新加坡控股平台（绿卡前设置）\n        ↓\n境外信托/保险架构（绿卡前完成）\n        ↓ 支付EB-5投资款\n美国EB-5区域中心项目（$800K，投资资产）\n        ↓ I-829获批后\n美国绿卡持有者投资组合\n  ├── 美国投资账户（符合PFIC规则）\n  ├── 境外资产（通过境外架构合规持有）\n  └── 美国自住房产\n\`\`\`\n\n### 6.2 绿卡前税务规划重点\n\n- 在获得绿卡前完成"税务身份转换成本基础"的重新定价（step-up in basis），以降低未来退出时的美国资本利得税。\n- 清理PFIC（被动外国投资公司）持仓，避免美国高税负和复杂申报。\n- 评估是否需要在绿卡前做大额赠与或资产结构调整。\n- 建立美国和非美国资产的税务隔离架构。\n\n### 6.3 不建议架构\n\n- 不建议拿到绿卡后仍用中国个人名义大量持有境外资产，CFC/PFIC规则可能触发严重税务问题。\n- 不建议用美国公司壳架构掩盖实际控制人而不做税务申报。\n- 不建议忽视FBAR（外国银行账户申报）和FATCA义务。\n\n---\n\n## 七、税务分析\n\n### 7.1 美国税务居民触发条件\n\n| 情形 | 税务判断 |\n|---|---|\n| 持有绿卡（Lawful Permanent Resident） | 自动成为美国税务居民，不论实际居住天数。 |\n| 符合实质居住测试（未持绿卡） | 当年在美国≥31天，且3年加权天数≥183天。 |\n| 拿到绿卡后未登陆/未居住在美国 | 只要绿卡身份未被正式放弃/撤销，仍是美国税务居民。 |\n| 绿卡后仍以中国为主要居住地 | 中美双边税务协定可能有减免，但申报义务不豁免。 |\n\n### 7.2 美国关键税种\n\n| 税种 | 税率 | 说明 |\n|---|---|---|\n| 联邦个人所得税 | 10%-37%（2026年税率） | 全球收入征税 |\n| 州所得税 | 0%-13.3%（各州不同） | 取决于居住州（如德州、佛州无州所得税） |\n| 资本利得税 | 0%-20%（长期）+ 3.8% NIIT（如适用） | 持有>1年为长期 |\n| 遗产税 | 40%（联邦，免税额$13.99M/人，2026年） | 2026年免税额可能减半（约$7M/人）需密切关注 |\n| 赠与税 | 40%（与遗产税共用终身免税额） | 大额生前赠与需规划 |\n| FBAR/8938 | 申报义务（非税） | 海外金融账户>$10,000须申报FBAR |\n\n### 7.3 税务风险边界\n\n- 拿到绿卡即触发全球征税，不因"未在美国居住"而豁免。\n- 绿卡持有者不能使用"非居民外国人"身份只申报美国来源收入。\n- 中国已缴税款可通过FTC（外国税收抵免）在美国抵扣，但申报复杂。\n- 如果最终决定放弃绿卡，高净值人士需评估"弃籍税"（Expatriation Tax）。\n\n---\n\n## 八、资金跨境合规方案\n\n### 8.1 推荐执行路径\n\n| 阶段 | 动作 | 周期 |\n|---|---|---|\n| 第1阶段 | 客户资产和资金来源体检（SOF初步评估） | 1-2周 |\n| 第2阶段 | 确认资金出境路径：境外存量/ODI/分红/资产变现 | 2-8周 |\n| 第3阶段 | 律师编制SOF文件包：纳税记录、分红决议、银行流水 | 4-8周 |\n| 第4阶段 | 开立或确认境外付款账户 | 1-3周 |\n| 第5阶段 | 律师审阅EB-5项目PPM+认购协议+就业报告 | 2-4周 |\n| 第6阶段 | 签署认购协议、汇款至项目托管账户 | 按协议节点 |\n| 第7阶段 | 提交I-526E申请（预留签证项目） | 资金到位后立即 |\n\n### 8.1.1 个人境外投资合规——37号文登记\n\n37号文全称《国家外汇管理局关于境内居民通过特殊目的公司境外投融资及返程投资外汇管理有关问题的通知》（汇发〔2014〕37号）。\n\n**核心要点：**\n- 适用对象：境内居民个人以境外特殊目的公司(SPV)进行境外投融资及返程投资\n- 需在设立/控制SPV后、向SPV出资前办理外汇登记\n- 登记机关：国家外汇管理局（通过银行办理）\n- 未办理37号文登记的后果：无法合规将境内资产注入境外SPV；返程投资（WFOE/FDI）时外汇无法合规入境；可能被认定为逃汇，面临行政处罚甚至刑事责任\n\n**与资金出境路径的关系：**\n- 如果客户通过ODI走企业路径，37号文主要影响个人股东层面\n- 如果客户计划以个人身份在境外设立SPV接收国内资产，须先完成37号文登记\n- 37号文+ODI可以互补：ODI覆盖企业对外投资，37号文覆盖个人对外持股\n\n**操作注意：**\n- 37号文登记须在\"出资前\"完成（先登记后出资），不可事后补办\n- 需要提供的材料：SPV注册文件、境内居民身份证明、境外融资商业计划书等\n- 实际办理周期：通常1-3个月（取决于当地外管局和银行审核速度）\n- 建议在资金出境方案设计阶段就同步评估37号文适用性\n\n### 8.2 严禁路径\n\n- 地下钱庄或私下换汇。\n- 现金搬运（未申报）。\n- 虚假贸易合同制造付款路径。\n- 第三方不明代付且无法解释受益人关系。\n- 加密货币兑换后不申报来源（USCIS要求说明每一美元的来源）。\n\n---\n\n## 九、身份路径规划\n\n### 9.1 EB-5投资移民主路径\n\n| 维度 | 内容 |\n|---|---|\n| 路径 | EB-5 区域中心项目（TEA/乡村/高失业区） |\n| 投资金额 | ≥USD 800,000（TEA）；≥USD 1,050,000（非TEA） |\n| 审理周期 | I-526E: 预留签证项目通常更快（1-3年，视USCIS处理速度）；非预留: 排期较长 |\n| 居住要求 | 绿卡后须有"在美定居意图"，建议每年至少在美国居住一定时间 |\n| 随行成员 | 配偶 + 21岁以下未婚子女 |\n| 转永久绿卡 | 取得条件绿卡满21-24个月后提交I-829，证明投资持续+就业已创造 |\n| 入籍条件 | 首次获得条件绿卡起满5年（无论I-829是否已批）；5年内至少30个月在美居住 |\n| 退出机制 | I-829获批后按项目协议安排退出 |\n\n### 9.2 备选路径\n\n| 路径 | 门槛 | 适用场景 | 备注 |\n|---|---:|---|---|\n| EB-5（非TEA） | USD 1,050,000 | 不要求项目在TEA | 投资额更高 |\n| 土耳其CBI+E-2 | 土耳其基金USD 500,000+ | 先拿土耳其护照，再申请E-2赴美 | E-2非绿卡，但可快速赴美；注意PL 117-263三年住所要求 |\n| L-1→EB-1C | 跨国高管 | 已有跨国企业结构，可作为高管派驻美国 | 适合已有境外业务的企业主 |\n| EB-1A杰出人才 | 行业杰出成就+10项中满足3项 | 有行业知名度、奖项、媒体报道的企业家/专业人士 | 无需雇主担保 |\n| NIW国家利益豁免 | 高学历+事业具国家利益 | 硕士以上/杰出能力的专业人士 | 需满足Dhanasar三要素 |\n\n#### EB1A+NIW双递交策略（同套材料）\n\nEB-1A和NIW共享许多证据类别，可同时准备一套材料递交两份申请：\n\n- **共享优先日**：如果NIW的I-140先获批，EB-1A后递交时可请求保留NIW的优先日\n- NIW门槛低于EB-1A（Dhanasar三要素），作为保底方案\n- EB-1A排期通常比NIW短，最终仍优先走EB-1A\n- 策略：NIW保底+EB-1A冲刺，两不耽误\n\n| 项目 | EB-1A | NIW | 双递交(共享材料) |\n|------|-------|-----|----------------|\n| 律师费 | $15,000-25,000 | $10,000-18,000 | $20,000-30,000 |\n| USCIS费(I-140) | $715 | $715 | $715×2=$1,430 |\n| I-485(调整身份) | $1,440/人 | $1,440/人 | 一份即可 |\n| 加急审理 | $2,805 | $2,805 | 可选 |

### 9.2.1 NIW国家利益豁免办理流程

NIW（National Interest Waiver）是EB-2职业移民的一个特殊类别，允许申请人绕过劳工证（PERM）程序，直接以"符合美国国家利益"为由申请绿卡。核心法源为Dhanasar案确立的三要素标准。

#### Dhanasar三要素逐项说明

| 要素 | 要求 | 证据举例 |
|---|---|---|
| 第一要素：申请人从事的事业具有实质性价值和国家重要性 | 事业领域对美国经济、文化、教育、健康、科技等有显著价值 | 商业计划书、行业研究报告、政府政策文件引用、专利商业化计划 |
| 第二要素：申请人有能力推进该事业 | 申请人具备成功推进事业的学历、经验、资源、过往成就 | 学位证书、工作经历证明、项目成果、专利、论文、推荐信 |
| 第三要素：综合来看，豁免劳工证对美国有利 | 申请人的独特价值使劳工证程序不必要或有损国家利益 | 论证申请人不可替代性、事业紧迫性、对行业的独特贡献 |

| 第2步 | 准备推荐信：联系5-10位独立推荐人（行业专家、合作方、客户），撰写并签署推荐信 | 4-8周 | 签署完毕的推荐信原件 |

#### NIW+EB1A双递交策略

NIW和EB-1A可同时递交，共享一套证据材料：

- **NIW保底**：NIW门槛低于EB-1A（Dhanasar三要素 vs. 十项标准满足三项），作为安全网
- **EB-1A冲刺**：EB-1A排期通常比NIW短（当前中国出生EB-1A排期约1-2年，NIW排期约3-4年）
- **共享优先日**：如NIW先获批，EB-1A后递交时可请求保留NIW的优先日
- **并行审理**：两案独立审理，互不干扰；任一获批即可进入下一步
- **推荐策略**：先递交NIW锁定优先日→同步准备EB-1A材料→条件成熟时递交EB-1A加急审理

\n\n### 9.3 O1杰出人才签证\n\nO1是美国非移民工作签证，面向在科学/艺术/教育/商业/体育领域有杰出能力的人士。核心价值：\n\n**O1基本条件：**\n- 需证明申请人属于其领域内\"顶尖\"人才（高于EB-1A的\"杰出\"标准但实务中材料高度重叠）\n- 需美国雇主/代理（agent）提交I-129申请\n- 初始有效期3年，可无限期续签1年/次\n- 无年度配额限制，无H-1B抽签\n\n**O1自雇策略（关键创新）：**\n- 申请人可在美国注册一家公司（LLC/C-Corp），以该公司作为\"雇主/代理\"为自己申请O1\n- 公司须有真实业务计划、美国客户/合作伙伴、银行账户\n- 通过O1自雇模式，申请人可提前赴美生活和工作，完全不受EB-5排期或EB-1A审理周期影响\n- O1通常可加急审理（premium processing，15个日历日）\n\n**O1+EB1A双递交（同套材料+优先登陆策略）：**\n- O1和EB-1A对申请人\"杰出能力\"的证明标准高度重叠（奖项、媒体报道、原创贡献、高薪、协会会员、评审、发表物、展览、领导角色、商业成功）\n- 可同时准备一套材料，同时递交O1（I-129）和EB-1A（I-140）\n- O1审批极快（加急15天）→获批后持O1签证立即赴美生活工作\n- 同时等待EB-1A排期（中国出生有约1-2年排期），排到后境内I-485调整身份\n- 核心价值：拿到O1即实现\"人在美国等绿卡\"，不用在国内千年等排期\n\n**适合客户画像：**\n- 有行业知名度、奖项、媒体报道的企业家\n- 有专利、论文、原创贡献的技术创始人\n- 有展览、评审经历的设计师/艺术家\n- 年收入显著高于行业平均水平的高管

#### O1自雇模式特别说明

O1自雇是当前最具操作性的快速赴美路径之一。核心逻辑：申请人以自己注册的美国公司作为"雇主/代理"，为自己提交O1申请。

| 维度 | 说明 |
|---|---|
| 公司类型 | 推荐LLC（有限责任公司），设立简便、税务穿透、管理灵活 |
| 注册地点 | 推荐特拉华州（公司法成熟）或怀俄明州（低成本、隐私保护） |
| 注册资本 | 无最低要求，但建议$10,000-$50,000以证明公司运营能力 |
| 业务计划 | 须详细说明美国市场策略、客户开发计划、收入预测 |
| 银行账户 | 须开设美国商业银行账户，完成注资 |
| 办公地址 | 可用虚拟办公室（Virtual Office）或共享办公空间 |

#### O1+EB1A双递交时间轴

| 月份 | O1路径 | EB-1A路径 |
|---|---|---|
| 第1月 | 评估+注册美国LLC公司 | 同步评估EB-1A条件 |
| 第2月 | 收集整理杰出能力证明(同套材料) | 同套材料 |
| 第3月 | 律师撰写O1申请书 | 律师撰写EB-1A申请书 |
| 第4月 | 提交I-129(加急) + I-140(加急) | 双递交 |
| 第4.5月 | ★ O1获批(加急15天) | 等待审理 |
| 第5月 | 持O1签证赴美生活、工作 | 继续等待 |
| 第6-18月 | 在美国境内经营公司、续签O1 | EB-1A排期等待中 |
| 第18-24月 | O1持续有效 | ★ EB-1A排到，境内I-485调整身份 |
| 第24月+ | 获得绿卡后O1自动失效 | ★ 获得绿卡 |

> **核心优势**：O1加急15天获批，实现"人在美国等绿卡"——不用在国内等EB-1A排期（中国出生约1-2年）。

### 9.5 EB-1A杰出人才办理流程

EB-1A（Alien of Extraordinary Ability）是美国职业移民第一优先类别，面向在科学、艺术、教育、商业或体育领域具有"杰出能力"的人士。无需雇主担保、无需劳工证，可直接申请绿卡。

#### EB-1A 10项标准逐项准备指南

申请人须满足以下10项标准中的至少3项（或提供一次性重大成就证据，如诺贝尔奖、奥斯卡奖等）：

| 编号 | 标准 | 证据形式 | 难度 | 准备周期 |
|---|---|---|---|---|
| 1 | 全国或国际性奖项 | 获奖证书、奖杯照片、评奖标准说明 | ⭐⭐ | 1-2周 |
| 2 | 专业协会会员 | 会员证书、协会章程（须证明会员资格需杰出成就方可获得） | ⭐⭐ | 1-2周 |
| 3 | 媒体报道 | 主流媒体对申请人及其工作的报道原件 | ⭐⭐⭐ | 2-4周 |
| 4 | 评审经历 | 担任同行评审、比赛评委、期刊审稿人的证明 | ⭐ | 1-2周 |
| 5 | 原创贡献 | 专利、论文、技术标准、商业方法创新及其影响力证据 | ⭐⭐⭐⭐ | 4-8周 |
| 6 | 学术文章发表 | 在专业期刊/主流媒体发表的学术文章 | ⭐⭐ | 2-4周 |
| 7 | 艺术作品展览 | 作品在知名展览/画廊的展出记录 | ⭐⭐ | 1-2周 |
| 8 | 领导/关键角色 | 在知名机构担任领导或关键角色的证明 | ⭐⭐⭐ | 2-4周 |
| 9 | 高薪/高报酬 | 薪资显著高于同行业同职位平均水平 | ⭐⭐ | 1-2周 |
| 10 | 商业成功 | 票房、唱片销量、销售收入等商业成功证据 | ⭐⭐⭐ | 2-4周 |

> **策略提示**：多数企业家客户可聚焦第1、3、5、8、9项（奖项+媒体报道+原创贡献+领导角色+高薪），5项中满足3项即可。技术创始人额外可走第4、6项（评审+发表）。艺术家可走第1、3、7项（奖项+报道+展览）。

#### EB-1A加急审理策略

| 策略 | 说明 | 推荐度 |
|---|---|---|
| 直接加急（Premium Processing） | I-140提交时即选择加急，15个日历日出结果 | ⭐⭐⭐⭐⭐ 强烈推荐 |
| 普通递交后追加加急 | 先普通递交，收到Receipt Notice后再追加加急 | ⭐⭐⭐ 适用于材料需补充完善的情况 |
| 纯普通审理 | 不加急，等待6-12个月 | ⭐ 仅适用于条件极强、不急于赴美的客户 |

> **加急策略核心**：EB-1A加急费$2,805（2026年标准），15天内必出结果（批准/补件/拒绝）。如果被发RFE（补件通知），回复后加急再15天出结果。时间成本远低于金钱成本，强烈建议所有EB-1A申请人走加急通道。

\n\n### 9.6 E-2衔接逻辑（如客户选择先拿土耳其护照）\n\n中国护照非E-2条约国。如客户选择先通过土耳其CBI取得土耳其国籍，再申请E-2签证：\n\n| 条件 | 要求 |\n|---|---|\n| 国籍 | 申请人须为土耳其公民（E-2条约国） |\n| 投资 | 在美国进行实质性投资（建议$100,000-200,000+） |\n| 企业控制 | 持股≥50%并积极参与经营管理 |\n| 注意事项 | PL 117-263（2022年12月生效）：通过投资入籍取得条约国国籍者，须在该国连续居住满3年后方可申请E-2（美国律师须逐一判断） |\n| E-2性质 | 非移民签证，不是绿卡；可续签但无上限；不直接通向绿卡 |\n\n---\n\n## 十、教育规划\n\n美国绿卡对子女教育的价值显著：\n\n| 教育阶段 | 绿卡/公民优势 | 非绿卡（国际生）对比 |\n|---|---|---|\n| K-12公立学校 | 免费入读优质公立学校（学区制） | 通常不可入读公立K-12（除非持F-1入读私立） |\n| 大学录取 | 与美国生源同一池子竞争（大多数州立大学将绿卡视为州内申请人） | 国际生池子，录取竞争更激烈 |\n| 大学学费 | 州内学费（in-state），约为国际生的1/3-1/2 | 全额国际生学费 |\n| 联邦助学贷款/助学金 | 可申请FAFSA、Pell Grant等 | 不可申请 |\n| 实习/工作 | 可自由实习和工作（无需OPT/CPT） | 需OPT→H-1B抽签→绿卡 |\n| STEM就业 | 不受H-1B配额限制的就业自由 | H-1B抽签概率约15-25% |\n\n建议：如果客户核心是子女教育且子女年龄在15岁以下，EB-5可以在大学前完成、享受州内学费和录取优势；若子女已接近18岁，需评估排期和CSPA年龄保护。\n\n---\n\n## 十一、福利居住国规划\n\n### 11.1 美国绿卡主要福利\n\n| 福利类别 | EB-5绿卡持有者 | 说明 |\n|---|---|---|\n| 医疗保险 | 无全民医保，须自购或雇主提供保险 | 65+可申请Medicare（需工作10年+纳税）；低收入可申请Medicaid（绿卡5年后） |\n| 教育 | K-12免费公立教育；大学州内学费 | 核心价值之一 |\n| 社会保障 | 需积累40个社保积分（约10年工作纳税） | 退休后可领取Social Security |\n| 就业 | 自由就业（除部分需公民身份的职位） | 无H-1B/OPT限制 |\n| 购房 | 可购房，可申请房贷 | 无额外限制 |\n| 养老 | 自购养老/依赖Social Security+401K/IRA | 美国无全民养老金 |\n\n### 11.2 推荐定位\n\n**美国 = 最强身份工具 + 教育福利 + 就业/创业自由 + 全球征税成本。不是低成本高福利国，而是"高成本高回报"的选择。**\n\n对于以"身份安全"和"子女教育"为核心目标的高净值家庭，美国路径的长期价值可能不可替代；但如果主要诉求是税务优化或低成本第二身份，应认真对比其他选项。\n\n---\n\n## 十二、预算明细汇总\n\n### 12.1 基础预算（EB-5 TEA项目）\n\n| 项目 | 金额/口径 | 是否必须 | 说明 |\n|---|---:|---|---|\n| EB-5投资款 | USD 800,000 | 必须 | 向TEA区域中心项目投资，锁定期通常至I-829获批。 |\n| 项目发行费 | USD 70,000-80,000 | 必须 | 区域中心收取的管理/发行费用。 |\n| 律师费 | USD 25,000-35,000 | 必须 | 美国持牌移民律师服务费（含I-526E递交）。 |\n| I-526E申请费 | USD 6,155 | 必须/官方 | USCIS收取。 |\n| I-829申请费 | USD 9,525 | 必须/官方 | 条件绿卡满21-24个月后递交。 |\n| I-485调整身份费 | USD 1,440/人 | 必须/官方 | 境内调整身份（如适用）。 |\n| 资金来源文件费 | USD 3,000-8,000 | 必须 | SOF编制、翻译、认证、会计/审计师费用。 |\n| 体检费 | USD 200-500/人 | 必须 | 指定移民医生体检。 |\n| 国内公证/认证/翻译 | 约RMB 20,000 | 必须 | 出生/结婚/无犯罪等文件的公证翻译。 |\n| 服务费 | ¥15-25万 | 必须 | 顾问/移民公司服务费，按服务范围和路径复杂度确定。 |\n\n### 12.1.1 三方费用清单\n\n| 类别 | 费用项目 | 收费机构/对象 | 参考金额 | 付款节点 | 备注 |\n|---|---|---|---:|---|---|\n| 投资款 | EB-5投资本金 | 项目托管账户 | USD 800,000 | 签署认购协议后 | TEA项目。 |\n| 发行费 | 项目发行/管理费 | 区域中心 | USD 70,000-80,000 | 与投资款同时 | 各项目不同。 |\n| 律师费 | 移民律师费 | 美国移民律所 | USD 25,000-35,000 | 签署律师协议后 | 含I-526E全套递交。 |\n| 官方费用 | I-526E申请费 | USCIS | USD 6,155 | I-526E递交时 | 区域中心项目。 |\n| 官方费用 | I-829申请费 | USCIS | USD 9,525 | 条件绿卡到期前 | 含指纹费。 |\n| 官方费用 | I-485/DS-260 | USCIS/使领馆 | USD 1,440/人 | 调整身份/面签时 | 按家庭成员人数。 |\n| 官方费用 | 指纹费 | USCIS | USD 85/人 | 随I-485/I-829 | 含在申请费中。 |\n| 文件费 | SOF编制 | 会计师/审计师 | USD 3,000-8,000 | 文件准备阶段 | 视资产复杂度。 |\n| 文件费 | 翻译/公证/认证 | 国内机构 | RMB 15,000-25,000 | 材料准备阶段 | 取决于文件数量。 |\n| 体检费 | 移民体检 | 指定医生 | USD 200-500/人 | I-485/面签前 | 按人数计。 |\n| 旅行费 | 面签/登陆差旅 | 客户自理 | 按实际 | 面签/绿卡激活 | 如走领馆程序。 |\n\n### 12.1.2 费用合计预估（人民币万元）\n\n> 估算口径：按主申请人家庭四人（主申+配偶+2名21岁以下子女）测算；汇率暂按 \`1 USD = 7.20 RMB\`；实际以付款日汇率、律师账单、USCIS收费标准、区域中心PPM为准。\n\n| 费用类别 | 外币/人民币金额 | 折合人民币（万元） | 说明 |\n|---|---:|---:|---|\n| EB-5投资本金 | USD 800,000 | 576.00 | 投资本金，I-829获批后按项目规则退出。 |\n| 项目发行费 | USD 75,000 | 54.00 | 取中值估算。 |\n| 移民律师费 | USD 30,000 | 21.60 | 全家服务费中值。 |\n| I-526E申请费 | USD 6,155 | 4.43 | USCIS官方。 |\n| I-829申请费（全家） | USD 9,525 + USD 85×4 = USD 9,865 | 7.10 | 含指纹。 |\n| I-485调整费 | USD 1,440 × 4 = USD 5,760 | 4.15 | 按四人家庭估算。 |\n| SOF文件费 | USD 5,000 | 3.60 | 取中值。 |\n| 体检费 | USD 350 × 4 = USD 1,400 | 1.01 | 按四人估算。 |\n| 国内公证/翻译/认证 | 约RMB 20,000 | 2.00 | 按材料数量预估。 |\n| 服务费 | — | 15.00-25.00 | 按路径复杂度确定。 |\n| **合计费用性支出** | — | **~97.89** | 不含投资本金。 |\n| **合计（含投资本金）** | — | **~673.89** | 投资本金可退出。 |\n\n### 12.2 材料清单\n\n| 申请人 | 文件类型 | 要求 | 备注 |\n|---|---|---|---|\n| 主申请人 | 护照 | 有效期6个月以上 | 首页扫描件 |\n| 主申请人 | 出生公证 | 中英文 | 含父母信息 |\n| 主申请人 | 婚姻状况公证 | 结婚/离婚 | 含配偶信息 |\n| 主申请人 | 无犯罪记录证明 | 近5年所有居住超6个月国家的无犯罪 | 中英文翻译 |\n| 主申请人 | 照片 | 美国签证规格（2×2英寸白底） | 近6个月 |\n| 主申请人 | 资金来源全套文件 | 纳税记录、银行流水、分红决议、审计报告 | SOF核心文件包 |\n| 配偶 | 护照+出生公证+无犯罪+照片 | 同主申请人 | — |\n| 子女 | 护照+出生公证+无犯罪（如适用）+照片 | 21岁以下未婚 | 出生证须含父母信息 |\n| 全家 | I-526E申请表/I-485/DS-260 | 律师填写 | 客户签字 |\n| 全家 | 移民体检报告 | I-693表 | 指定医生 |\n\n### 12.3 三方材料清单\n\n| 责任方 | 材料/文件 | 用途 |\n|---|---|---|\n| 客户 | 护照、照片、出生/婚姻/无犯罪公证 | 身份与家庭关系证明 |\n| 客户 | 纳税记录、银行流水、企业文件、分红决议 | SOF资金来源证明 |\n| 律师 | I-526E全套申请表+SOF文件包+商业计划书附件 | EB-5申请核心文件 |\n| 区域中心 | PPM、认购协议、TEA认定函、就业创造报告、项目文件 | EB-5项目合规依据 |\n| 经济学家 | 就业创造方法论报告 | 证明满足10+就业要求 |\n| 会计师/审计师 | 资金来源报告/审计意见（如需要） | SOF专业支持 |\n\n---\n\n## 十三、执行时间轴\n\n### 13.1 标准执行路径\n\n| 时间 | 动作 | 责任方 | 交付物 |\n|---|---|---|---|\n| 第1-2周 | 客户信息收集、家庭成员确认、SOF初步评估 | 顾问+客户+律师 | 客户信息表、SOF可行性判断 |\n| 第2-4周 | 律师确认EB-5路径、推荐预留签证项目、提供费用明细 | 律师+顾问 | 路径确认、项目列表、费用明细 |\n| 第4-8周 | SOF文件收集与编制：纳税记录、银行流水、企业文件 | 客户+会计师+律师 | SOF文件包 |\n| 第4-8周 | 项目尽调：审查PPM、就业报告、资金结构、退出机制 | 律师+客户 | 项目尽调报告 |\n| 第8-12周 | 签署认购协议和律师协议 | 客户+律师+区域中心 | 认购协议、律师委托书 |\n| 第10-14周 | 汇款至项目托管账户、取得汇款凭证 | 客户+银行 | 汇款确认函 |\n| 第12-16周 | 律师提交I-526E申请 | 律师 | I-526E回执 |\n| 第16周后 | 等待I-526E审理（预留签证项目通常1-2年） | USCIS+律师 | I-526E批准函 |\n| I-526E获批后 | 领馆面签(DS-260)或境内调整身份(I-485) | 客户+律师 | 移民签证/条件绿卡 |\n| 登陆美国 | 入境激活绿卡 → 取得2年条件绿卡 | 客户 | 条件绿卡 |\n| 条件绿卡第21-24月 | 律师提交I-829申请 | 律师+客户 | I-829回执 |\n| I-829获批后 | 获得10年永久绿卡 | 客户 | 永久绿卡 |\n| 条件绿卡获批第5年后 | 满足入籍条件可申请N-400 | 客户+律师 | 美国护照 |

</svg>\n### 13.3 本周立即行动清单\n\n| 编号 | 动作 | 目的 |\n|---|---|---|\n| 1 | 确认客户家庭成员年龄、婚姻状态、21岁以下子女情况 | 判断随行资格和CSPA保护 |\n| 2 | 确认客户核心目标：永久绿卡/E-2快速赴美/子女教育 | 避免路径错配 |\n| 3 | SOF初步评估：客户资金主要来源（企业分红/房产出售/股权变现/境外资产） | 排除SOF不可行客户 |\n| 4 | 确认客户是否接受美国全球征税义务 | 税务意愿前置筛选 |\n| 5 | 联系美国移民律师推荐预留签证项目列表 | 锁定无排期项目机会 |\n| 6 | 如客户更倾向于先E-2快速赴美，评估土耳其CBI+E-2路径可行性 | 交叉对比两种路径 |\n\n---\n\n## 十四、重要风险声明\n\n### 14.1 投资风险\n\n**EB-5投资不是存款，不是保本投资。项目可能失败、就业可能不足、资金可能无法按期返还。客户应将其视为"用资金成本购买绿卡机会"而非"投资增值"。**\n\n### 14.2 政策风险\n\n**EB-5政策历史上多次变化：RIA设定$800K/TEA有效期至2027年9月30日，之后可能按通胀调整。预留签证的"Current"状态可能随时因申请量饱和而出现排期。正式申请前必须由美国移民律师确认最新政策。**\n\n### 14.3 税务风险\n\n**取得美国绿卡即触发全球征税义务，不论是否在美国居住。高净值客户须在绿卡获批前完成税务架构规划（step-up in basis、退出PFIC、架构调整、弃籍税评估）。忽视税务规划可能导致严重的税务后果。**\n\n### 14.4 资金来源风险\n\n**任何地下钱庄、虚假贸易、来源不清的资金都可能直接导致I-526E被拒、投资款被冻结、甚至终身禁止入境美国。SOF编制不是"准备文件"，而是对每一美元的合法来源进行可追溯的证明。**\n\n### 14.5 排期风险\n\n**非预留签证类别中国内地出生者有较长排期（目前约2015-2016年）。预留签证类别目前Current，但申请量可能在2027年前大幅增加导致排期。**\n\n### 14.6 国籍风险\n\n**入籍美国后根据《中国国籍法》第9条自动丧失中国国籍。客户必须在拿到绿卡前明确：五年后是否要入籍？如果入籍，是否接受中国国籍丧失的后果？**\n\n---\n\n## 附件：引用法律法规与项目资料来源\n\n### A. 本次方案引用到的法律依据清单\n\n| 法案/规则 | 条款/款项 | 本次用途 | 最新更新 | 备注 |\n|---|---|---|---|---|\n| 《移民与国籍法》（INA） | INA 203(b)(5) | EB-5投资移民法源 | — | EB-5上位法依据。 |\n| 《EB-5改革与诚信法案》（RIA）2022 | 全文 | 重新授权EB-5区域中心计划至2027年9月，设定$800K/$1,050K标准，设立预留签证类别，加强诚信措施 | 2022年5月13日生效 | 当前EB-5核心法案依据。 |\n| 2026年6月签证公告（Visa Bulletin） | — | 确认中国出生者排期状态：预留签证"Current"，非预留有排期 | 2026年6月 | 每月更新。 |\n| USCIS Policy Manual Vol.6 Part G | — | EB-5投资人和区域中心申请的操作指南 | 持续更新 | I-526E/I-829审理标准。 |\n| INA 101(a)(15)(E) | — | E-2条约投资人签证法源 | — | 备选路径参考。 |\n| Public Law 117-263 | E签证修订 | 通过投资入籍取得条约国国籍者的3年居住要求 | 2022-12-27生效 | 对土耳其/格林纳达CBI+E-2路径有重大影响。 |\n| 《中华人民共和国国籍法》 | 第3条、第9条 | 中国不承认双重国籍；中国公民自愿加入外国国籍自动丧失中国国籍 | 现行有效 | 入籍美国的最高风险条款。 |\n| 《中华人民共和国个人所得税法》 | — | 中国税务居民全球收入申报义务 | 现行有效 | 绿卡前后均需评估。 |\n| IRC（美国国内税收法典） | 第1条、第911条、第877A条等 | 美国全球征税、外国税收抵免、弃籍税等 | 持续修订 | 税务架构设计依据。 |\n| Bank Secrecy Act / FBAR | 31 U.S.C. 5311 et seq. | 海外金融账户申报（FBAR FinCEN Form 114） | 现行有效 | 绿卡后每年申报义务。 |\n| FATCA | 26 U.S.C. 6038D | 特定海外金融资产申报（IRS Form 8938） | 现行有效 | 高净值绿卡持有者须重点关注。 |\n\n### B. 多个法案之间的相互影响\n\n| 组合 | 相互影响 | 需要注意的点 |\n|---|---|---|\n| RIA + 签证公告 | RIA设定预留签证类别，签证公告反映实际排期状态 | 预留签证"Current"不等于永久无排期，申请量饱和后可能出现排期。 |\n| EB-5绿卡 + IRC全球征税 | 拿到绿卡即触发美国全球纳税义务 | 绿卡前后税务规划必须同步进行，不可拖延。 |\n| 中国国籍法 + 美国入籍 | 入籍美国即自动丧失中国国籍 | 客户必须提前做出5年规划：入籍还是只持绿卡？ |\n| EB-5 + 中国外汇管制 | 800K+资金出境须合规 | 资金路径方案须在SOF编制前确定。 |\n| 土耳其CBI + E-2 + EB-5 | 先拿土耳其护照→E-2赴美→EB-5转绿卡 | PL 117-263三年住所要求是关键障碍；E-2不是绿卡，但可作为EB-5等待期间的居留方案。 |\n\n### C. 法律适用注意事项\n\n1. 本方案以INA 203(b)(5)和RIA 2022为EB-5核心法源。\n2. EB-5投资不是被动金融投资——USCIS审查的是"风险投资"（at-risk investment），不保本不保收益。\n3. SOF是EB-5申请中拒签率最高的一环，必须由经验丰富的移民律师和会计师协同完成。\n4. 预留签证无排期是当前最大窗口期，但RIA下的$800K标准有效期至2027年9月30日。\n5. 绿卡税务义务从拿到绿卡的第一天开始，不是从登陆美国居住开始。\n6. 客户拿到绿卡后每年须申报FBAR（海外账户>$10,000）和FATCA Form 8938（海外资产超阈值）。\n7. 最终落地须三方确认：美国移民律师确认法条和递交流程，项目方确认PPM和就业模型，税务师确认税务后果。\n\n### D. 交付前客户需补充与确认资料\n\n1. 客户完整家庭信息与随行成员名单（含所有21岁以下子女出生日期）。\n2. 主申请人及随行成员护照、身份证、户口本、婚姻/出生证明。\n3. 近5年个人所得税申报记录和完税证明。\n4. 企业营业执照、审计报告、股东名册、分红决议。\n5. 资金来源主体文件：房产出售合同、股权转让协议、赠与/继承文件等。\n6. 境内外全部银行账户清单（用于SOF和后续FBAR申报）。\n7. 美国移民律师出具的最新EB-5项目推荐、费用明细和法条适配确认。\n8. 美国税务师出具的税务影响分析（绿卡前架构建议）。\n";`;
